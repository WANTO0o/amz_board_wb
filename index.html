<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AMZ增长工作室</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body class="login-page">
<header class="app-header" id="app-header"></header>
<main class="login-stage">
  <section class="login-shell">
    <aside class="login-aside">
      <div class="login-aside-brand"><span class="login-dot"></span> AMZ增长工作室</div>
      <h1>一个账号<br>进入所有工具</h1>
      <p>把关键词、用户洞察与搜索词分析，收进同一个工作台。</p>
      <div class="login-aside-foot">AMZ GROWTH STUDIO</div>
    </aside>
    <div class="login-panel">
      <div class="login-panel-head">
        <h2>欢迎回来</h2>
        <p class="muted">登录以继续</p>
      </div>
      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">登录</button>
        <button id="tab-signup" class="tab" type="button">注册</button>
      </div>
      <form id="form" novalidate>
        <label>邮箱
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" required>
        </label>
        <p id="hint" class="msg msg-ok" hidden></p>
        <p id="err" class="msg msg-err" role="alert" hidden></p>
        <button id="submit" class="btn btn-primary btn-block" type="submit">登录</button>
      </form>
      <p id="fatal" class="msg msg-err" hidden></p>
    </div>
  </section>
</main>
<script src="assets/config.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var requested = new URLSearchParams(location.search).get('next') || '';
  var next = window.safeNext ? (window.safeNext(requested) || '') : '';
  if (!next) next = (window.APP_BASE || '/') + 'home/';

  if (window.mountHeader) window.mountHeader('');

  var mode = 'login';
  var form = document.getElementById('form');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var submit = document.getElementById('submit');
  var err = document.getElementById('err');
  var hint = document.getElementById('hint');

  function setMode(m) {
    mode = m;
    document.getElementById('tab-login').className = 'tab' + (m === 'login' ? ' active' : '');
    document.getElementById('tab-signup').className = 'tab' + (m === 'signup' ? ' active' : '');
    submit.textContent = m === 'login' ? '登录' : '注册';
    password.autocomplete = m === 'login' ? 'current-password' : 'new-password';
    err.hidden = true;
    hint.hidden = true;
  }
  document.getElementById('tab-login').onclick = function () { setMode('login'); };
  document.getElementById('tab-signup').onclick = function () { setMode('signup'); };

  if (window.sb) {
    window.sb.auth.getSession().then(function (r) {
      if (r.data && r.data.session) location.replace(next);
    });
  }

  form.onsubmit = async function (e) {
    e.preventDefault();
    if (!window.sb) { window.showMsg('err', '页面配置没加载好，请刷新重试', 'err'); return; }
    err.hidden = true; hint.hidden = true;
    var mail = email.value.trim();
    var pwd = password.value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { window.showMsg('err', '邮箱格式不太对', 'err'); return; }
    if (!pwd || pwd.length < 6) { window.showMsg('err', '密码至少 6 位', 'err'); return; }
    submit.disabled = true;
    submit.textContent = mode === 'login' ? '登录中…' : '注册中…';
    try {
      if (mode === 'signup') {
        var r = await window.sb.auth.signUp({ email: mail, password: pwd });
        if (r.error) throw r.error;
        if (r.data && r.data.session) { location.replace(next); return; }
        setMode('login');
        window.showMsg('hint', '注册成功。去邮箱点一下确认链接，再回来登录。', 'ok');
      } else {
        var s = await window.sb.auth.signInWithPassword({ email: mail, password: pwd });
        if (s.error) throw s.error;
        location.replace(next);
      }
    } catch (ex) {
      window.showMsg('err', window.humanError(ex), 'err');
    } finally {
      submit.disabled = false;
      submit.textContent = mode === 'login' ? '登录' : '注册';
    }
  };
})();
</script>
</body>
</html>
