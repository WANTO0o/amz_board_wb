<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing 增长诊断报告 · 关键词作战台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* 报告是重表格页面：容器不限宽，只留左右内边距，尽量吃满屏幕宽度 */
  .wrap { max-width: none; padding-left: 20px; padding-right: 20px; }
</style>
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="wrap">
  <p id="msg" class="msg" hidden></p>
  <section class="card">
    <iframe id="frame" class="report-frame hidden" title="Listing 增长诊断报告"
      sandbox="allow-same-origin allow-top-navigation-by-user-activation"></iframe>
  </section>
  <p class="foot">报告由后台工人生成，本页在线渲染，不会跳转到文件柜地址</p>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG;
  var frame = document.getElementById('frame');
  var taskId = new URLSearchParams(location.search).get('task');
  var lastRev = null;
  var MODULES = [
    { id: '01', name: '关键词作战总表' }, { id: '02', name: '自然位标杆' },
    { id: '03', name: '否定词清单' },     { id: '04', name: '竞对对比' },
    { id: '05', name: '图片与卖点诊断' }, { id: '06', name: '广告诊断与优化' }
  ];
  var stepState = null;    // module_steps 汇总，读不到时为 null（只按报告点亮状态降级展示）
  var reportReady = {};    // 报告分节是否点亮，从 iframe 里的 .mi-tag.on 读，不信任数据库

  function esc(s) { return window.esc(s); }
  function stepsUrl(mod) {
    var u = new URL(window.APP_BASE + 'task/', location.href);
    u.searchParams.set('task', taskId || '');
    if (mod) u.searchParams.set('module', mod);
    return u.href;
  }
  // 「模块进度 / 返回工具页」已挪进报告标题栏（由 decorate 注入），这里只提供地址。
  var backUrl = window.APP_BASE + 'tool/';

  // 注入到报告 iframe 的样式：菜单徽标 + 选中未完成模块时详情里的跳转条。
  // 报告 HTML 是 sandbox 里的静态内容，不执行脚本，切换模块靠 CSS，所以提示条插进 pane 即可只在选中时显示。
  var RP_CSS = [
    '.rp-todo{flex:0 0 auto;font-size:10px;font-weight:600;padding:2px 6px;border-radius:9px;background:#fdf3e2;color:#a35b06;white-space:nowrap}',
    '.rp-todo-fail{background:#fdeceb;color:#b02a20}',
    '.rp-goto{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid #f3d39a;background:#fffaf0;color:#8a5a08;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:12px;line-height:1.7}',
    '.rp-goto.is-fail{border-color:#f3b4ae;background:#fff5f4;color:#a3281c}',
    '.rp-goto-txt{flex:1 1 260px;min-width:0}',
    '.rp-steps{flex:1 1 100%;font-size:11.5px;color:#6b7280;overflow-wrap:anywhere;word-break:break-word}',
    '.rp-goto a{flex:0 0 auto;display:inline-flex;align-items:center;padding:5px 12px;border-radius:7px;background:#2563eb;color:#fff;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}',
    '.rp-goto a:hover{background:#1d4ed8;text-decoration:none}',
    '.rp-legacy{margin:0 0 14px}',
    // 重表格页面：让每张表至少铺满内容区，列按 colgroup 比例舒展；窄于原生宽度时仍靠 .scroll 横向滚动，不破版。
    '.scroll table{min-width:100%!important}',
    '.scroll{max-width:none}',
    // 两个全局动作按钮从外壳挪进报告标题栏（宽屏右上，窄屏另起一行）。
    '.rp-head{position:relative}',
    '.rp-head h1{padding-right:200px}',
    '.rp-acts{position:absolute;right:0;top:-2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}',
    '.rp-acts a{display:inline-flex;align-items:center;padding:6px 11px;border:1px solid #d8dee6;border-radius:7px;background:#fff;color:#475569;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;line-height:1.4}',
    '.rp-acts a:hover{background:#f4f6fa;border-color:#c9d0da;text-decoration:none}',
    '.rp-acts-legacy{position:static;margin:0 0 12px}',
    '@media(max-width:760px){.rp-todo{display:none}.rp-goto-txt{flex-basis:100%}}',
    '@media(max-width:760px){.rp-head h1{padding-right:0}.rp-acts{position:static;margin:0 0 10px}}'
  ].join('\n');

  function summarizeSteps(rows) {
    var m = {};
    MODULES.forEach(function (x) { m[x.id] = { todo: [], fail: [], done: 0, off: 0 }; });
    (rows || []).forEach(function (s) {
      var x = m[s.module]; if (!x) return;
      if (s.status === '失败') x.fail.push(s);
      else if (s.status === '待确认' || s.status === '已批准' || s.status === '执行中') x.todo.push(s);
      else if (s.status === '已完成') x.done++;
      else x.off++;
    });
    return m;
  }

  async function loadSteps() {
    if (!taskId || !window.sb) return;
    var r = await window.sb.from(C.STEP_TABLE || 'module_steps')
      .select('module,step,status,error_reason').eq('task_id', taskId);
    stepState = r.error ? null : summarizeSteps(r.data || []);
  }

  // 只用来决定「这个模块的详情里要不要插跳转条」，报告页顶部不再单独展示进度板块。
  function stateOf(id) {
    var ready = !!reportReady[id];
    var x = stepState && stepState[id];
    var fail = x ? x.fail.length : 0;
    var todo = x ? x.todo.length : 0;
    return {
      ready: ready, fail: fail, todo: todo, list: x,
      need: (!ready || fail > 0 || todo > 0)
    };
  }

  function gotoBoxHtml(m, s) {
    function stepLabel(t) { return (t.module ? t.module + '/' : '') + t.step; }
    var head = s.ready
      ? (s.fail ? '这一节已出报告，但有步骤失败' : '这一节已出报告，还有步骤待确认')
      : '这一节还没出报告';
    var detail = [];
    if (s.list) {
      s.list.fail.forEach(function (t) {
        detail.push(stepLabel(t) + ' 失败' + (t.error_reason
          ? '：' + String(t.error_reason).slice(0, 60) : '，可单项重试'));
      });
      s.list.todo.forEach(function (t) { detail.push(stepLabel(t) + ' ' + t.status); });
      if (!s.list.fail.length && !s.list.todo.length && !s.ready && s.list.off) {
        detail.push('前置步骤还没开放，先完成上一步');
      }
    }
    var txt = detail.length ? detail.slice(0, 4).join('；') : '去模块进度页看当前步骤与预估调用量';
    return '<span class="rp-goto-txt"><b>' + esc(head) + '</b>：在模块进度页确认后，后台才会跑这一步，报告会自动刷新。</span>'
      + '<span class="rp-steps">当前进度：' + esc(txt) + '</span>'
      + '<a data-rp-goto="1" target="_top" href="' + esc(stepsUrl(m.id)) + '">去模块进度页处理 ' + m.id + ' →</a>';
  }

  function resizeFrame() {
    try {
      var d = frame.contentDocument;
      var h = d && d.documentElement ? d.documentElement.scrollHeight : 0;
      frame.style.height = Math.max(h + 40, 520) + 'px';
    } catch (e) { frame.style.height = '900px'; }
  }
  function changeHandler() { setTimeout(resizeFrame, 0); }
  function gotoHandler(e) {
    var a = e.target && e.target.closest ? e.target.closest('a[data-rp-goto]') : null;
    if (!a) return;
    e.preventDefault();
    // 处理函数在父页上下文执行：顶层导航不受 iframe sandbox 限制
    window.location.href = a.getAttribute('href');
  }

  // 幂等：每次自动刷新、每次 srcdoc 重建后都能重跑，先清掉自己上次注入的节点
  function decorate() {
    var d;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    // 没有 src 的空 iframe 会先 onload 一次 about:blank，别在空文档上做任何注入。
    // 真正的报告文档（新格式或早期格式）body 里一定有内容，等下一次 onload / 兜底再装饰。
    if (!d.body.children.length) return;
    Array.prototype.forEach.call(d.querySelectorAll('[data-rp-inject]'), function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    var st = d.createElement('style');
    st.setAttribute('data-rp-inject', '1');
    st.textContent = RP_CSS;
    d.head.appendChild(st);

    // 把「模块进度 / 返回工具页」两个按钮注入报告标题栏右上角；早期格式无 .rp-head 时放正文最前。
    var acts = d.createElement('div');
    acts.setAttribute('data-rp-inject', '1');
    acts.className = 'rp-acts';
    acts.innerHTML = '<a data-rp-goto="1" target="_top" href="' + esc(stepsUrl()) + '">模块进度 →</a>'
      + '<a data-rp-goto="1" target="_top" href="' + esc(new URL(backUrl, location.href).href) + '">返回工具页</a>';
    var head = d.querySelector('.rp-head');
    if (head) head.appendChild(acts);
    else d.body.insertBefore(acts, d.body.firstChild);

    // 骨架改造前的早期报告没有模块菜单（只有 01 总表）：按正文里有没有模块名判定点亮，
    // 并在报告顶部插一条跳转条（早期报告模板不再改动）。
    var legacy = !d.querySelector('.page');
    var bodyText = d.body.innerText || d.body.textContent || '';
    reportReady = {};
    MODULES.forEach(function (m) {
      var label = d.querySelector('.mi[for="m' + m.id + '"]');
      var pane = d.querySelector('.pane-' + m.id);
      reportReady[m.id] = legacy
        ? bodyText.indexOf(m.name) >= 0
        : !!(label && label.querySelector('.mi-tag.on'));
      var s = stateOf(m.id);
      if (!s.need) return;
      if (label) {
        var badge = d.createElement('span');
        badge.setAttribute('data-rp-inject', '1');
        badge.className = 'rp-todo' + (s.fail ? ' rp-todo-fail' : '');
        badge.textContent = s.fail ? (s.fail + ' 项失败')
          : (s.todo ? (s.todo + ' 项待确认') : '待出报告');
        label.appendChild(badge);
      }
      if (pane) {
        var box = d.createElement('div');
        box.setAttribute('data-rp-inject', '1');
        box.className = 'rp-goto' + (s.fail ? ' is-fail' : '');
        box.innerHTML = gotoBoxHtml(m, s);
        var title = pane.querySelector('.pane-title');
        if (title && title.nextSibling) pane.insertBefore(box, title.nextSibling);
        else if (title) pane.appendChild(box);
        else pane.insertBefore(box, pane.firstChild);
      }
    });
    if (legacy) {
      var missing = MODULES.filter(function (m) { return !reportReady[m.id]; })
        .map(function (m) { return m.id + ' ' + m.name; }).join('、');
      var lb = d.createElement('div');
      lb.setAttribute('data-rp-inject', '1');
      lb.className = 'rp-goto rp-legacy';
      lb.innerHTML = '<span class="rp-goto-txt"><b>这是早期格式的报告，只有已出模块的正文</b>：'
        + '这一版没有模块切换菜单，完整进度和后续确认都在模块进度页。</span>'
        + '<span class="rp-steps">还没出的模块：' + esc(missing || '无') + '</span>'
        + '<a data-rp-goto="1" target="_top" href="' + esc(stepsUrl()) + '">去模块进度页 →</a>';
      d.body.insertBefore(lb, d.body.firstChild);
    }
    d.addEventListener('click', gotoHandler, true);
    d.addEventListener('change', changeHandler, true);
    setTimeout(resizeFrame, 0);
  }

  frame.onload = function () { decorate(); };

  async function load() {
    if (!taskId) { window.showMsg('msg', '网址里没有任务号，从工具页点「查看报告」进来吧', 'err'); return; }
    if (!window.sb) { window.showMsg('msg', '页面配置没加载好，请刷新重试', 'err'); return; }
    var r = await window.sb.from(C.TASK_TABLE).select('*').eq('id', taskId).maybeSingle();
    if (r.error) { window.showMsg('msg', '读取任务失败：' + window.humanError(r.error), 'err'); return; }
    var t = r.data;
    if (!t) { window.showMsg('msg', '没找到这个任务，可能不是你提交的，或者任务号写错了', 'err'); return; }

    await loadSteps();
    if (t.status === '失败') {
      reportReady = {};
      window.showMsg('msg', '这个任务失败了：' + (t.error_reason || '未说明原因'), 'err'); return;
    }
    if (t.status !== '已完成' || !t.report_url) {
      reportReady = {};
      window.showMsg('msg', '报告还在生成中（全量 200 词一般 10–30 分钟），这页会每 30 秒自动重试一次', 'info');
      return;
    }
    var rev = Number(t.report_revision || 0);
    if (lastRev !== null && rev === lastRev && !frame.classList.contains('hidden')) { decorate(); return; }
    window.hideMsg('msg');
    window.showMsg('msg', '正在取回报告…', 'info');
    try {
      var url = t.report_url + (t.report_url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + rev;
      var res = await fetch(url, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('报告取回失败 HTTP ' + res.status);
      var html = await res.text();
      frame.srcdoc = html;
      frame.classList.remove('hidden');
      lastRev = rev;
      setTimeout(decorate, 120);   // srcdoc 解析晚于 onload 时兜底
      window.hideMsg('msg');
    } catch (ex) {
      window.showMsg('msg', '报告渲染失败：' + window.humanError(ex), 'err');
    }
  }

  (async function () {
    var s = await window.requireSession();
    if (!s) return;
    window.mountHeader('查看报告');
    await load();
    setInterval(load, C.REFRESH_MS || 30000);
  })();
})();
</script>
</body>
</html>
