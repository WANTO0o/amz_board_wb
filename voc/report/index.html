<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户洞察报告 · AMZ增长工作室</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../assets/style.css">
<style>
  /* 报告占满整个视口（顶部只留全站菜单），不再是带边框/标题栏的小窗 */
  .wrap.report-full { max-width: none; margin: 0; padding: 0; }
  .report-full .report-frame { display: block; width: 100%; min-height: 0; border: 0; border-radius: 0; background: #fff; }
</style>
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="wrap report-full">
  <p id="msg" class="msg" hidden></p>
  <iframe id="frame" class="report-frame hidden" title="用户洞察报告"
    sandbox="allow-same-origin allow-top-navigation-by-user-activation"></iframe>
</main>
<script src="../../assets/config.js"></script>
<script src="../../assets/supabase.js"></script>
<script src="../../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var TABLE = 'voc_tasks';
  // 报告桶公开域名：报告 HTML 由工人存到 voc/ 目录，路径写回任务表 report_path。
  // 模块 0 没有报告；这段先把「按任务表取路径 → 加载报告」的壳立着。
  var REPORT_BASE = 'https://tools-amz-board-wb.oss-cn-shenzhen.aliyuncs.com/';
  var taskId = new URLSearchParams(location.search).get('task');
  var frame = document.getElementById('frame');
  var msg = document.getElementById('msg');

  // 报告铺满视口：高度 = 视口高 − 顶部菜单高；窗口缩放时重算。
  function fitFrame() {
    if (frame.classList.contains('hidden')) return;
    var hd = document.getElementById('app-header');
    var hdH = hd ? hd.offsetHeight : 0;
    frame.style.height = Math.max(240, window.innerHeight - hdH) + 'px';
  }
  window.addEventListener('resize', fitFrame);

  async function load() {
    if (!taskId) { window.showMsg('msg', '缺少任务号，请从任务列表点「打开报告」', 'err'); return; }
    if (!window.sb) { window.showMsg('msg', '页面配置没加载好，请刷新重试', 'err'); return; }
    var r = await window.sb.from(TABLE).select('asins,status,report_path')
      .eq('id', taskId).eq('user_id', (await window.sb.auth.getUser()).data.user.id).maybeSingle();
    if (r.error) { window.showMsg('msg', window.humanError(r.error), 'err'); return; }
    if (!r.data) { window.showMsg('msg', '找不到这条任务，或不是你的任务', 'err'); return; }
    if (r.data.asins) document.title = '用户洞察报告 · ' + r.data.asins + ' · AMZ增长工作室';
    var p = r.data.report_path;
    if (!p) {
      window.showMsg('msg', '这份任务的报告还没生成（当前状态：' + (r.data.status || '—') + '）。模块 3 接通后工人会把报告放进文件柜，这里会自动打开。', 'info');
      return;
    }
    var url = /^https?:\/\//i.test(p) ? p : REPORT_BASE + String(p).replace(/^\/+/, '');
    // 报告对象带 Content-Disposition:attachment（OSS bucket 级规则），直接 src 会触发下载。
    // 与现有工具报告页一致：fetch 取回文本塞进 srcdoc，走内联渲染，不经浏览器下载逻辑。
    window.showMsg('msg', '正在取回报告…', 'info');
    try {
      var res = await fetch(url, { method: 'GET', cache: 'no-store' });
      if (!res.ok) throw new Error('报告取回失败 HTTP ' + res.status);
      var html = await res.text();
      frame.srcdoc = html;
      frame.classList.remove('hidden');
      fitFrame();
      requestAnimationFrame(fitFrame);   // 菜单挂载后高度可能微调，下一帧再算一次
      window.hideMsg('msg');
    } catch (ex) {
      window.showMsg('msg', '报告渲染失败：' + window.humanError(ex), 'err');
    }
  }

  if (!window.requireSession) return;
  window.requireSession().then(function (s) {
    if (!s) return;
    if (window.mountHeader) window.mountHeader('用户洞察报告');
    load();
  });
})();
</script>
</body>
</html>
