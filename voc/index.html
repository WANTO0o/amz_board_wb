<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户洞察 · AMZ增长工作室</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* VOC 发起页：沿用工作台设计变量；本页专有样式只作用于 .voc-* */
  .voc-form { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .voc-form select, .voc-form .btn { margin-top: 0; }
  .voc-form select { width: auto; min-width: 128px; }
  .voc-asin-box { flex: 1 1 320px; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .voc-asin-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
  .voc-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 6px;
    background: #e8efff; color: #1d4ed8; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .voc-chip button { border: 0; background: transparent; color: #1d4ed8; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .voc-asin-input { flex: 1 1 180px; min-width: 120px; border: 0 !important; outline: none !important;
    box-shadow: none !important; margin: 0 !important; padding: 3px 4px !important; width: auto !important; }
  .voc-count { flex: 0 0 auto; font-size: 12px; color: var(--muted); }
  .voc-opts { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
  .voc-opts > div { min-width: 0; }
  .voc-opts .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .voc-seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .voc-seg button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
    color: var(--text); font-size: 13px; font-family: inherit; cursor: pointer; }
  .voc-seg button.on { border-color: var(--brand); background: #e8efff; color: #1d4ed8; font-weight: 600; }
  .voc-dims { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .voc-dim { background: #1f2937; color: #fff; border-radius: 7px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; }
  .voc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .voc-task { border: 1px solid var(--line); border-radius: 9px; padding: 15px 16px; background: #fff; }
  .voc-task-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .voc-task-asin { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .voc-task-meta { color: var(--muted); font-size: 12px; margin: 9px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .voc-progress-line { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .voc-bar { height: 7px; border-radius: 5px; background: var(--gray-bg); margin: 7px 0 12px; overflow: hidden; }
  .voc-bar > i { display: block; height: 100%; background: var(--brand); border-radius: 5px; transition: width .3s; }
  .voc-task-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .voc-task-id { font-size: 12px; color: var(--muted); }
  @media (max-width: 620px) {
    .btn-row .btn, .voc-opts .btn { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
    .voc-form .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="wrap">
  <section class="card">
    <h2>用户洞察</h2>
    <p class="desc">输入 ASIN，逐条理解真实评论中的需求、场景与购买动机。</p>
    <p id="fatal" class="msg msg-err" hidden></p>
    <div class="voc-form">
      <select id="site" aria-label="站点">
        <option value="美国站">美国站</option>
        <option value="日本站">日本站</option>
      </select>
      <div class="voc-asin-box" id="asin-box">
        <input id="asin-input" class="voc-asin-input" type="text" placeholder="输入 ASIN，按空格或回车添加" autocomplete="off" maxlength="10">
      </div>
      <span class="voc-count" id="asin-count">0/10</span>
      <button id="btn-analyze" class="btn btn-primary" type="button">分析</button>
    </div>
    <div class="voc-opts">
      <div>
        <span class="lbl">每个 ASIN 目标评论条数</span>
        <div class="voc-seg" id="target-seg">
          <button type="button" data-v="100">100</button>
          <button type="button" data-v="200" class="on">200</button>
          <button type="button" data-v="300">300</button>
          <button type="button" data-v="500">500</button>
        </div>
      </div>
      <div>
        <span class="lbl">评论范围</span>
        <div class="voc-seg" id="scope-seg">
          <button type="button" data-v="with_variants" class="on">含变体评论</button>
          <button type="button" data-v="asin_only">仅本 ASIN</button>
        </div>
      </div>
    </div>
    <p id="msg" class="msg" hidden></p>
    <div class="voc-dims" id="voc-dims"></div>
    <div class="field-note">上面八个标签是评论标注维度，工人会逐条打标；本页提交后任务进入队列。</div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>分析报告</h2>
      <span class="spacer"></span>
      <button id="btn-refresh" class="btn btn-sm" type="button">刷新</button>
    </div>
    <div id="task-list" class="voc-cards"><p class="muted">加载中…</p></div>
    <div class="field-note" id="last-refresh"></div>
  </section>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG;
  var TABLE = 'voc_tasks';
  var MAX = 10;
  var DIMENSIONS = ['功能价值','产品使用对象','体验价值','场景','保障价值','人群','购买动机','未满足需求'];
  var SITES = { '美国站': '美国站', '日本站': '日本站' };
  var asins = [];
  var target = 200;
  var scope = 'with_variants';
  var session = null;

  var box = document.getElementById('asin-box');
  var input = document.getElementById('asin-input');
  var count = document.getElementById('asin-count');
  var siteSel = document.getElementById('site');
  var list = document.getElementById('task-list');

  function renderDims() {
    document.getElementById('voc-dims').innerHTML = DIMENSIONS.map(function (d) {
      return '<span class="voc-dim">' + window.esc(d) + '</span>';
    }).join('');
  }
  function renderChips() {
    var chips = asins.map(function (a, i) {
      return '<span class="voc-chip">' + window.esc(a)
        + '<button type="button" data-idx="' + i + '" aria-label="删除">×</button></span>';
    }).join('');
    box.innerHTML = chips + '<input id="asin-input" class="voc-asin-input" type="text" '
      + 'placeholder="' + (asins.length ? '' : '输入 ASIN，按空格或回车添加') + '" autocomplete="off" maxlength="10">';
    input = document.getElementById('asin-input');
    count.textContent = asins.length + '/' + MAX;
    Array.prototype.forEach.call(box.querySelectorAll('.voc-chip button'), function (b) {
      b.onclick = function () { asins.splice(Number(b.getAttribute('data-idx')), 1); renderChips(); };
    });
    bindInput();
  }
  function addAsin(raw) {
    var a = String(raw || '').trim().toUpperCase();
    if (!a) return;
    if (!/^B0[A-Z0-9]{8}$/.test(a)) { window.showMsg('msg', 'ASIN 要 B0 开头、共 10 位', 'err'); return; }
    if (asins.length >= MAX) { window.showMsg('msg', '最多 ' + MAX + ' 个 ASIN', 'err'); return; }
    if (asins.indexOf(a) >= 0) { window.showMsg('msg', '这个 ASIN 已经加过了', 'err'); return; }
    asins.push(a); window.hideMsg('msg'); renderChips();
  }
  function bindInput() {
    input.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault(); addAsin(input.value);
      } else if (e.key === 'Backspace' && !input.value && asins.length) {
        asins.pop(); renderChips();
      }
    };
    input.onblur = function () { if (input.value.trim()) { addAsin(input.value); } };
  }

  function bindSeg(id, cb) {
    document.getElementById(id).onclick = function (e) {
      var b = e.target.closest('button[data-v]'); if (!b) return;
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on'); cb(b.getAttribute('data-v'));
    };
  }

  var STATUS_MAP = { '排队中':'tag-wait', '抓评论':'tag-run', '标注中':'tag-run', '生成报告':'tag-run', '完成':'tag-done', '失败':'tag-fail' };
  function tag(s) { return '<span class="tag ' + (STATUS_MAP[s] || 'tag-wait') + '">' + window.esc(s || '—') + '</span>'; }

  // created_at 是 UTC（Supabase timestamptz），转成北京时间（UTC+8）显示到分钟。
  // 只做时间展示，不参与任何判定；解析失败回退原串，不影响列表。
  function fmtCreatedAt(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso).slice(0, 16);
    var b = new Date(d.getTime() + 8 * 3600 * 1000);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return b.getUTCFullYear() + '-' + p(b.getUTCMonth() + 1) + '-' + p(b.getUTCDate()) +
      ' ' + p(b.getUTCHours()) + ':' + p(b.getUTCMinutes());
  }

  async function loadTasks() {
    if (!session) return;
    var r = await window.sb.from(TABLE).select('*')
      .eq('user_id', session.user.id).order('created_at', { ascending: false }).limit(10);
    if (r.error) {
      list.innerHTML = '<p class="msg msg-err">' + window.esc(window.humanError(r.error)) + '</p>';
      return;
    }
    var rows = r.data || [];
    if (!rows.length) { list.innerHTML = '<p class="muted">还没有任务。先加 ASIN，点「分析」。</p>'; return; }
    list.innerHTML = rows.map(function (t) {
      var total = t.asins.split('+').length * t.review_target;
      var pct = total ? Math.min(100, Math.round((t.annotated_count || 0) / total * 100)) : 0;
      var short = String(t.id).slice(0, 8);
      var foot = '';
      if (t.status === '完成' && t.report_path) {
        foot = '<a class="btn btn-sm btn-primary" href="' + window.APP_BASE + 'voc/report/?task=' + encodeURIComponent(t.id) + '">打开报告</a>';
      } else if (t.status === '失败') {
        foot = '<span class="msg msg-err" style="margin:0;padding:4px 8px">' + window.esc(t.error_reason || '未知原因') + '</span>';
      } else {
        foot = '<span class="muted">工人处理中…</span>';
      }
      return '<div class="voc-task">'
        + '<div class="voc-task-head"><span class="voc-task-asin">' + window.esc(t.asins.split('+').join(' + ')) + '</span>' + tag(t.status) + '</div>'
        + '<div class="voc-task-meta"><span>站点：' + window.esc(t.site) + '</span>'
        + '<span>每个 ASIN：' + t.review_target + ' 条</span>'
        + '<span>范围：' + (t.review_scope === 'asin_only' ? '仅本 ASIN' : '含变体评论') + '</span>'
        + '<span>生成时间：' + fmtCreatedAt(t.created_at) + '</span></div>'
        + '<div class="voc-progress-line"><span>目标总量：' + total + ' 条</span>'
        + '<span>标注进度：' + (t.annotated_count || 0) + '/' + total + '</span></div>'
        + '<div class="voc-bar"><i style="width:' + pct + '%"></i></div>'
        + '<div class="voc-task-foot"><span class="voc-task-id">任务 ID：' + short + '</span>' + foot + '</div>'
        + '</div>';
    }).join('');
    document.getElementById('last-refresh').textContent = '最近刷新：' + new Date().toLocaleTimeString();
  }

  async function submit() {
    if (!window.sb) { window.showMsg('msg', '页面配置没加载好，请刷新重试', 'err'); return; }
    if (input && input.value.trim()) addAsin(input.value);
    if (!asins.length) { window.showMsg('msg', '至少加一个 ASIN', 'err'); return; }
    var btn = document.getElementById('btn-analyze');
    btn.disabled = true; btn.textContent = '提交中…';
    try {
      var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
          });
      var row = {
        id: id, user_id: session.user.id, asins: asins.join('+'),
        site: siteSel.value, review_target: target, review_scope: scope, status: '排队中'
      };
      var r = await window.sb.from(TABLE).insert([row]);
      if (r.error) throw r.error;
      window.showMsg('msg', '任务已提交，正在排队', 'ok');
      asins = []; renderChips();
      await loadTasks();
    } catch (ex) {
      window.showMsg('msg', window.humanError(ex), 'err');
    } finally {
      btn.disabled = false; btn.textContent = '分析';
    }
  }

  renderDims(); bindInput(); renderChips();
  bindSeg('target-seg', function (v) { target = Number(v); });
  bindSeg('scope-seg', function (v) { scope = v; });
  document.getElementById('btn-analyze').onclick = submit;
  document.getElementById('btn-refresh').onclick = loadTasks;

  if (!window.requireSession) return;
  window.requireSession().then(function (s) {
    session = s; if (!session) return;
    if (window.mountHeader) window.mountHeader('用户洞察');
    loadTasks();
    setInterval(loadTasks, Number(C.REFRESH_MS || 30000));
  });
})();
</script>
</body>
</html>
