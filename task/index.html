<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模块进度 · 关键词作战台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* ===== 模块分组：标题条（父）＋ 缩进步骤区（子），层次一眼可分 ===== */
  .mod-group { margin: 20px 0 0; }
  .mod-group:first-child { margin-top: 4px; }
  .mod-group-auto { margin-top: 10px; }
  /* 从报告页点具体模块跳过来：高亮定位，免得六个模块里再找一遍 */
  .mod-group-focus { outline:2px solid #2563eb; outline-offset:3px; border-radius:10px; }
  #focus-tip { border-left:3px solid #2563eb; background:#eef3fb; color:#334155;
    padding:9px 12px; border-radius:6px; font-size:12px; line-height:1.7; margin:12px 0 0; }
  .mod-head {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border:1px solid #d8e2f2; border-radius:10px; background:#eef3fb;
  }
  .mod-num {
    flex:0 0 34px; width:34px; height:34px; border-radius:8px;
    background:#2563eb; color:#fff; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; letter-spacing:.5px;
  }
  .mod-title-wrap { flex:1; min-width:0; }
  .mod-title { font-size:15px; font-weight:600; color:#1f2937; line-height:1.3; }
  .mod-sub { font-size:11.5px; color:#6b7280; margin-top:3px; line-height:1.4; }
  .mod-side { flex:0 0 auto; display:flex; align-items:center; gap:10px; }
  .mod-progress { font-size:11.5px; color:#5f6b7f; white-space:nowrap; }
  .mod-sum { font-size:11.5px; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .mod-sum-ok { background:#e8f5ee; color:#0f7a4d; }
  .mod-sum-fail { background:#fdeceb; color:#b02a20; }
  .mod-sum-wait { background:#fdf3e2; color:#a35b06; }
  .mod-sum-off { background:#e7ebf1; color:#475569; }

  /* 子步骤区：左侧竖线＋连接短线＋整体缩进，明确从属于上面的分组 */
  .mod-body { margin:10px 0 0 16px; padding:0 0 0 24px; border-left:2px solid #d8e2f2; }
  .step-card {
    position:relative; border:1px solid #e2e6ec; border-radius:8px;
    padding:14px 16px; margin:0 0 10px; background:#fff;
    box-shadow:0 1px 2px rgba(16,24,40,.03);
  }
  .step-card:last-child { margin-bottom:2px; }
  .step-card::before {
    content:''; position:absolute; left:-26px; top:23px; width:26px; height:2px; background:#d8e2f2;
  }
  .step-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .step-seq {
    font-size:11px; font-weight:600; color:#1d4ed8; background:#e8efff;
    border-radius:5px; padding:2px 7px; white-space:nowrap;
  }
  .step-name { font-size:14px; font-weight:600; color:#1f2937; }
  .step-tag { font-size:11.5px; padding:2px 9px; border-radius:999px; border:1px solid rgba(0,0,0,.10); }
  .st-done { background:#eaf3de; color:#27500a; }
  .st-wait { background:#faeeda; color:#633806; }
  .st-run { background:#e6f1fb; color:#0c447c; }
  .st-fail { background:#fcebeb; color:#791f1f; }
  .st-off { background:#f1efe8; color:#5f5e5a; }
  /* 实际消耗里含整段 JSON，窄屏必须允许断行，否则会把整页撑出横向滚动 */
  .step-meta { font-size:12px; color:#5f5e5a; margin:8px 0; line-height:1.7; overflow-wrap:anywhere; word-break:break-word; }
  .step-meta.est { color:#475569; }
  .quota-box { border-left:3px solid #a32d2d; background:#fcebeb; color:#791f1f; padding:10px 12px; border-radius:6px; font-size:13px; line-height:1.7; margin:10px 0; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:10px 0; }
  .form-grid label { display:block; font-size:12px; color:#444; }
  .form-grid input, .form-grid select, .form-grid textarea { width:100%; box-sizing:border-box; margin-top:4px; }
  textarea.rules-json { width:100%; box-sizing:border-box; min-height:170px; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.5; }
  table.mini { width:100%; border-collapse:collapse; font-size:13px; }
  table.mini th, table.mini td { border-bottom:1px solid rgba(0,0,0,.08); padding:6px 8px; text-align:left; vertical-align:top; }
  .draft-box { background:#f8f9fb; border-radius:8px; padding:10px 12px; font-size:12px; max-height:260px; overflow:auto; }
  /* 04 阶段二：逐条确认表 */
  .f04-wrap { background:#f8f9fb; border:1px solid #e6eaf1; border-radius:8px; padding:6px 10px 10px; max-height:430px; overflow:auto; }
  table.f04 { width:100%; border-collapse:collapse; font-size:12.5px; min-width:620px; }
  table.f04 th, table.f04 td { border-bottom:1px solid rgba(0,0,0,.07); padding:7px 8px; text-align:left; vertical-align:top; }
  table.f04 th { position:sticky; top:0; background:#f8f9fb; color:#475569; font-weight:600; white-space:nowrap; }
  table.f04 select { width:100%; min-width:86px; box-sizing:border-box; }
  .f04-desc { font-size:11px; color:#6b7280; line-height:1.45; margin-top:3px; max-width:340px; overflow-wrap:anywhere; }
  .f04-draft { font-size:11.5px; padding:1px 7px; border-radius:999px; background:#e8efff; color:#1d4ed8; white-space:nowrap; }
  .f04-count { font-size:12px; color:#475569; margin:8px 0 0; line-height:1.6; }
  /* 05 一次确认：P6 清单可编辑、差评原文只读、竞对逐家可改跑/跳过 */
  .f05-wrap { background:#f8f9fb; border:1px solid #e6eaf1; border-radius:8px; padding:6px 10px 10px; max-height:300px; overflow:auto; }
  table.f05 { width:100%; border-collapse:collapse; font-size:12.5px; min-width:540px; }
  table.f05 th, table.f05 td { border-bottom:1px solid rgba(0,0,0,.07); padding:7px 8px; text-align:left; vertical-align:top; }
  table.f05 th { position:sticky; top:0; background:#f8f9fb; color:#475569; font-weight:600; white-space:nowrap; }
  table.f05 input[type="text"] { width:100%; min-width:120px; box-sizing:border-box; }
  table.f05 textarea { width:100%; min-width:150px; box-sizing:border-box; font-size:12px; line-height:1.45; resize:vertical; }
  table.f05-edit { min-width:760px; }
  .f05-cl-wrap { max-height:430px; }
  .f05-num { display:inline-block; min-width:18px; margin-right:5px; color:#94a3b8; font-size:11px; }
  .f05-source { font-size:11px; color:#6b7280; line-height:1.45; max-width:340px; overflow-wrap:anywhere; }
  .f05-count { font-size:12px; color:#475569; margin:8px 0 0; line-height:1.6; }
  .f05-tag { font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap; }
  .f05-done { background:#e8f5ee; color:#0f7a4d; }
  .f05-todo { background:#fdf3e2; color:#a35b06; }
  .f05-reviews { background:#fff; border:1px solid #e6eaf1; border-radius:8px; padding:8px 10px; margin:8px 0; max-height:240px; overflow:auto; }
  .f05-reviews-one + .f05-reviews-one { border-top:1px dashed #e6eaf1; margin-top:8px; padding-top:8px; }
  .f05-reviews-asin { font-size:11px; font-weight:600; color:#1d4ed8; margin-bottom:4px; }
  .f05-reviews-text { font-size:12px; color:#334155; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  .f05-warn { background:#fff7e6; border:1px solid #f2d59b; color:#8a5a00; border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.6; margin:8px 0; overflow-wrap:anywhere; }
  /* 06 润色：动作清单只读，理由可能很长必须能断行，确认勾选放在最后 */
  .f06-wrap { background:#f8f9fb; border:1px solid #e6eaf1; border-radius:8px; padding:6px 10px 10px; max-height:340px; overflow:auto; }
  table.f06 { width:100%; border-collapse:collapse; font-size:12.5px; min-width:600px; }
  table.f06 th, table.f06 td { border-bottom:1px solid rgba(0,0,0,.07); padding:7px 8px; text-align:left; vertical-align:top; }
  table.f06 th { position:sticky; top:0; background:#f8f9fb; color:#475569; font-weight:600; white-space:nowrap; }
  .f06-reason { font-size:11.5px; color:#475569; line-height:1.5; max-width:380px; overflow-wrap:anywhere; word-break:break-word; }
  .f06-src { font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap; background:#e8efff; color:#1d4ed8; }
  .f06-count { font-size:12px; color:#475569; margin:8px 0 0; line-height:1.6; }
  .f06-check { display:flex; align-items:flex-start; gap:8px; margin:10px 0 0; font-size:12.5px; color:#334155; line-height:1.6; }
  .f06-check input { width:auto; margin-top:3px; flex:0 0 auto; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  @media (max-width:620px) {
    .form-grid { grid-template-columns:1fr; }
    .mod-head { flex-wrap:wrap; }
    .mod-side { width:100%; justify-content:flex-end; }
    .mod-body { margin-left:10px; padding-left:14px; }
    .step-card::before { left:-16px; width:16px; }
    /* 基础 .btn 是 nowrap；06 这类长按钮在 375px 下会把整页撑出横向滚动，窄屏允许换行 */
    .btn-row .btn { max-width:100%; white-space:normal; overflow-wrap:anywhere; word-break:break-word; text-align:center; }
  }
</style>
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="wrap">
  <section class="card">
    <div class="card-head">
      <h2>模块进度与确认</h2>
      <span class="spacer"></span>
      <a class="btn btn-sm" id="back" href="#">返回工具页</a>
    </div>
    <p class="desc" id="meta">正在读取任务…</p>
    <p id="msg" class="msg" hidden></p>
    <div id="report-link"></div>
    <p id="focus-tip" hidden></p>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>六个模块</h2>
      <span class="muted" id="last-refresh" style="font-size:12px"></span>
      <span class="spacer"></span>
      <button id="btn-refresh" class="btn btn-sm" type="button">手动刷新</button>
    </div>
    <p class="field-note">01–03 上传后自动生成。04–06 需要你在这一页确认：先看预估调用量，点确认后后台才开始花钱；任何一步失败都只重试那一步，不影响别的模块。报告链接始终不变，点亮后会自动刷新。</p>
    <div id="steps">加载中…</div>
  </section>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG;
  var taskId = new URLSearchParams(location.search).get('task');
  var focusModule = new URLSearchParams(location.search).get('module');
  var focused = false;
  var stepsBox = document.getElementById('steps');
  var session = null;
  var editing = false;
  var stepMap = {};   // 按 step.id 存原始行，提交 05 时从这里取清单名，不把中文清单塞进 DOM 属性

  // 步骤显示名与先后顺序：按业务流程排，不按 step 字段的字母序
  var STEP_META = {
    '04/phase1':  { seq: 1, name: '竞对资料与清洗草案' },
    '04/confirm': { seq: 2, name: '逐条确认特征清单' },
    '05/batch':   { seq: 0, name: '一次确认并发布图片诊断' },
    '06/rules':   { seq: 1, name: '确认判断规矩' },
    '06/polish':  { seq: 2, name: '润色理由' }
  };
  var STEP_ORDER = { '04/phase1': 1, '04/confirm': 2, '05/batch': 1, '06/rules': 1, '06/polish': 2 };

  document.getElementById('back').href = window.APP_BASE + 'tool/';

  // 报告页带 &module=04 跳过来时只定位一次，免得 30 秒轮询反复把页面拽回去
  function focusOnce() {
    if (focused || !focusModule || !/^\d{2}$/.test(focusModule)) return;
    var el = stepsBox.querySelector('.mod-group[data-module="' + focusModule + '"]');
    if (!el) return;
    focused = true;
    el.classList.add('mod-group-focus');
    var title = el.querySelector('.mod-title');
    var tip = document.getElementById('focus-tip');
    if (tip) {
      tip.textContent = '从报告跳转过来：已定位到模块 ' + focusModule + ' '
        + (title ? title.textContent : '')
        + '。先看这一步的预估调用量，确认后后台才会开始跑；任何一步失败都只重试那一步。';
      tip.hidden = false;
    }
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function esc(s) { return window.esc(s); }
  function tag(status) {
    var cls = { '已完成': 'st-done', '待确认': 'st-wait', '已批准': 'st-run', '执行中': 'st-run',
      '失败': 'st-fail', '跳过': 'st-off', '未开放': 'st-off' }[status] || 'st-off';
    // 数据层仍存「未开放」（SQL check 与工人判定都认它），只把页面文案换成人话：
    // 它表示前置步骤的产出还没生成，不是功能没做。具体前置写在下方禁用按钮上。
    var label = status === '未开放' ? '待前置完成' : status;
    return '<span class="step-tag ' + cls + '">' + esc(label) + '</span>';
  }
  function estimateText(e) {
    if (!e) return '本步没有预估信息';
    if (e.paid === false || e.requests === 0) return '零付费：' + esc(e.note || '不调任何外部接口');
    var bits = [];
    if (e.sorftimeCli) bits.push('sorftime 商品档案 ' + e.sorftimeCli + ' 次');
    if (e.sorftimeMcp) bits.push('品类特征 MCP ' + e.sorftimeMcp + ' 次');
    if (e.deepseek) bits.push('DeepSeek ' + e.deepseek + ' 次');
    if (e.visionRequests) bits.push('视觉 ' + e.visionRequests + ' 请求 / ' + e.images + ' 图次');
    return '预计：' + bits.join(' ＋ ') + (e.note ? '。' + esc(e.note) : '');
  }
  function actualText(a) {
    if (!a || !Object.keys(a).length) return '';
    var bits = [];
    Object.keys(a).forEach(function (k) {
      if (k === 'reportUrl' || k === 'note') return;
      bits.push(k + '=' + (typeof a[k] === 'object' ? JSON.stringify(a[k]) : a[k]));
    });
    return '<div class="step-meta">实际消耗：' + esc(bits.join(' · ')) + (a.note ? '。' + esc(a.note) : '') + '</div>';
  }

  function rulesForm(step) {
    var d = (step.draft || {});
    var r = d.rules || {};
    var t = r.thresholds || {};
    var ans = r.answers || {};
    var tp = r.trendPolicy || {};
    var num = function (k, label, stepAttr) {
      return '<label>' + esc(label) + '<input type="number" step="' + (stepAttr || 'any') + '" data-rule-num="' + esc(k) + '" value="' + esc(t[k]) + '"></label>';
    };
    return '<div class="step-meta">' + esc(d.sourceNote || '默认带出上次定稿，编辑后仍需点确认才生效') + '</div>'
      + '<div class="form-grid">'
      + num('topRankMax', '前三判定（名次 ≤）') + num('deepRankMin', '深位起始（名次 ≥）')
      + num('acosLow', 'ACOS 低档（≤）') + num('acosHigh', 'ACOS 高档（>）')
      + num('crGood', '转化好（≥）') + num('crBad', '转化差（<）')
      + num('observeDays', '观察天数')
      + '<label>趋势数据口径<select data-rule-text="trendMode">'
      + '<option value="single-snapshot"' + (tp.mode === 'single-snapshot' ? ' selected' : '') + '>只有单次快照 → 待我判</option>'
      + '<option value="multi-snapshot"' + (tp.mode === 'multi-snapshot' ? ' selected' : '') + '>有多日位次 → 启用爬升判定</option>'
      + '</select></label>'
      + '</div>'
      + '<div class="form-grid">'
      + '<label>Q1 前三降不降<textarea rows="2" data-rule-text="Q1">' + esc(ans.Q1 || '') + '</textarea></label>'
      + '<label>Q2 深位/未上榜<textarea rows="2" data-rule-text="Q2">' + esc(ans.Q2 || '') + '</textarea></label>'
      + '<label>Q3 ACOS 高但在爬<textarea rows="2" data-rule-text="Q3">' + esc(ans.Q3 || '') + '</textarea></label>'
      + '</div>'
      + '<details><summary style="cursor:pointer;font-size:12px;color:#5f5e5a">高级：查看/编辑完整规矩 JSON</summary>'
      + '<textarea class="rules-json" data-role="rules-json" spellcheck="false">' + esc(JSON.stringify(r, null, 2)) + '</textarea></details>';
  }

  // 04 阶段二：默认带出阶段一清洗草案，三档逐条可改；提交只发 keep/drop/gap 三个名字数组。
  function confirmForm04(step) {
    var d = step.draft || {};
    var items = d.items || [];
    if (!items.length) {
      return '<div class="draft-box">阶段一还没有出清洗草案（可能卡在额度），先完成步骤 1：有失败就点「单项重试本步骤」。</div>';
    }
    if (!d.ready) {
      return '<div class="quota-box">竞对档案不齐，不能确认：'
        + esc((d.missingProductData || []).join('、') || ('档案 ' + (d.profiles || 0) + ' 行'))
        + '。请回步骤 1 补抓缺的 ASIN。</div>';
    }
    var rows = items.map(function (x, i) {
      var v = String(x.verdict || '保留');
      // 「你的判定」放第 2 列：宽表要横滚时，用户不用先滚到最右边才能改判定。
      return '<tr><td>' + (i + 1) + '</td>'
        + '<td><select data-f04-verdict="' + i + '" data-f04-name="' + esc(x.name)
        + '" data-f04-draft="' + esc(v) + '">'
        + ['保留', '剔除', '缺口'].map(function (o) {
          return '<option value="' + o + '"' + (o === v ? ' selected' : '') + '>' + o + '</option>';
        }).join('') + '</select></td>'
        + '<td><div>' + esc(x.name) + '</div><div class="f04-desc">' + esc(x.description || '') + '</div></td>'
        + '<td>' + (x.productShare == null ? '—' : esc(x.productShare) + '%') + ' / '
        + (x.salesShare == null ? '—' : esc(x.salesShare) + '%') + '</td>'
        + '<td><span class="f04-draft">' + esc(v) + '</span>'
        + '<div class="f04-desc">' + esc(x.reason || '') + '</div></td></tr>';
    }).join('');
    return '<div class="step-meta">' + esc(d.sourceNote || '') + '</div>'
      + '<div class="step-meta">' + esc(d.note || '') + ' · 竞对档案 ' + esc(d.profiles) + ' 行</div>'
      + '<div class="f04-wrap"><table class="mini f04"><thead><tr>'
      + '<th>#</th><th>你的判定</th><th>品类特征 / 说明</th><th>占比 产品 / 销量</th><th>草案判定 / 理由</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '<div class="f04-count" data-role="f04-count"></div>'
      + '<div class="btn-row"><button class="btn btn-sm" type="button" data-role="f04-reset">全部恢复为草案判定</button></div>'
      + '<div class="step-meta">' + esc(d.rule || '') + '</div>';
  }

  function f04Count(card) {
    var n = { '保留': 0, '剔除': 0, '缺口': 0 };
    Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
      if (n[s.value] != null) n[s.value]++;
    });
    var box = card.querySelector('[data-role="f04-count"]');
    if (box) box.textContent = '共 ' + (n['保留'] + n['剔除'] + n['缺口']) + ' 条：保留 '
      + n['保留'] + ' / 剔除 ' + n['剔除'] + ' / 缺口 ' + n['缺口']
      + '。剔除的不参与对比，保留＋缺口会逐方对照各家 listing 原话。';
  }

  // 05 一次确认（P6）：差评原文只读展示，确认清单可逐条改写／增删；竞对仍逐家可改跑/跳过。
  function clRowHtml(x, i) {
    return '<tr data-f05-row="' + i + '">'
      + '<td><span class="f05-num">' + (i + 1) + '</span>'
      + '<input type="text" data-f05-name="' + i + '" maxlength="80" placeholder="确认要素名" value="' + esc(x.name || '') + '"></td>'
      + '<td><input type="text" data-f05-en="' + i + '" maxlength="120" placeholder="英文说法" value="' + esc(x.en || '') + '"></td>'
      + '<td><textarea rows="2" maxlength="500" data-f05-source="' + i + '" placeholder="来源（写实：写清是哪条差评／哪张主图共性）">' + esc(x.source || '') + '</textarea></td>'
      + '<td><textarea rows="2" maxlength="500" data-f05-why="' + i + '" placeholder="买家为什么必须确认它才敢下单">' + esc(x.why || '') + '</textarea></td>'
      + '<td><button class="btn btn-sm btn-ghost" type="button" data-f05-del="' + i + '">删</button></td></tr>';
  }

  function collectClItems(card) {
    var out = [];
    Array.prototype.forEach.call(card.querySelectorAll('[data-f05-row]'), function (row) {
      var i = row.getAttribute('data-f05-row');
      var g = function (k) {
        var el = card.querySelector('[data-f05-' + k + '="' + i + '"]');
        return el ? String(el.value || '').trim() : '';
      };
      out.push({ name: g('name'), en: g('en'), source: g('source'), why: g('why') });
    });
    return out;
  }

  function clNorm(items) {
    return (items || []).map(function (x) {
      return { name: String(x.name || '').trim(), en: String(x.en || '').trim(),
        source: String(x.source || '').trim(), why: String(x.why || '').trim() };
    });
  }

  function clChanged(card) {
    var base = (((stepMap[card.getAttribute('data-step-id')] || {}).draft || {}).checklist) || [];
    return JSON.stringify(clNorm(base)) !== JSON.stringify(clNorm(collectClItems(card)));
  }

  function renderClRows(card, items) {
    var body = card.querySelector('[data-role="f05-cl-body"]');
    if (!body) return;
    body.innerHTML = items.length
      ? items.map(clRowHtml).join('')
      : '<tr><td colspan="5">清单为空，点「＋ 添加一条」补一条</td></tr>';
    bindClEvents(card);
    f05Count(card);
  }

  function bindClEvents(card) {
    Array.prototype.forEach.call(card.querySelectorAll(
      '[data-f05-name],[data-f05-en],[data-f05-source],[data-f05-why]'), function (el) {
      el.oninput = function () { markDirty(); f05Count(card); };
    });
    Array.prototype.forEach.call(card.querySelectorAll('[data-f05-del]'), function (b) {
      b.onclick = function () {
        var items = collectClItems(card);
        items.splice(Number(b.getAttribute('data-f05-del')), 1);
        renderClRows(card, items);
        markDirty();
      };
    });
    var add = card.querySelector('[data-f05-add]');
    if (add) add.onclick = function () {
      var items = collectClItems(card);
      items.push({ name: '', en: '', source: '', why: '' });
      renderClRows(card, items);
      markDirty();
    };
    var reset = card.querySelector('[data-f05-reset]');
    if (reset) reset.onclick = function () {
      var base = (((stepMap[card.getAttribute('data-step-id')] || {}).draft || {}).checklist) || [];
      renderClRows(card, clNorm(base));
      markDirty();
    };
  }

  function batchForm05(step) {
    var d = step.draft || {};
    var cl = clNorm(d.checklist || []);
    var names = d.checklistNames || cl.map(function (x) { return x.name; });
    var prev = step.decision || {};
    var prevMap = {};
    if (Array.isArray(prev.competitors)) {
      prev.competitors.forEach(function (c) { if (c && c.asin) prevMap[String(c.asin)] = c; });
    }
    // 失败重提时优先带出上次提交的清单（对象数组），否则用后台带出的默认清单。
    var clItems = Array.isArray(prev.checklist) && prev.checklist.length &&
      typeof prev.checklist[0] === 'object' ? clNorm(prev.checklist) : cl;
    var rows = clItems.map(clRowHtml).join('');
    var comps = (d.competitors || []).map(function (c, i) {
      var p = prevMap[String(c.asin)] || {};
      var run = (typeof p.run === 'boolean') ? p.run : (c.run !== false);
      var reason = String(p.reason != null ? p.reason : (c.reason || ''));
      var stateTag = c.done
        ? '<span class="f05-tag f05-done">已完成 · 留底复用</span>'
        : '<span class="f05-tag f05-todo">待跑</span>';
      return '<tr><td>' + esc(c.asin) + '</td>'
        + '<td><label><input type="checkbox" data-f05-run="' + i + '" data-f05-asin="' + esc(c.asin)
        + '" data-f05-done="' + (c.done ? '1' : '0') + '"' + (run ? ' checked' : '') + '> 跑这家</label></td>'
        + '<td><input type="text" data-f05-reason="' + i + '" placeholder="不跑才填：跳过原因" value="'
        + esc(reason) + '"' + (run ? ' disabled' : '') + '></td>'
        + '<td>' + esc(c.photoCount) + ' 张</td><td>' + stateTag + '</td></tr>';
    }).join('');
    var autoPub = (typeof prev.autoPublish === 'boolean') ? prev.autoPublish : (d.autoPublish !== false);
    var blocked = !d.ready
      ? '<div class="quota-box">还不能确认 05：'
        + esc(!d.m04Ready ? '04 竞对对比还没点亮，05 的图片 URL 全部来自 04 正式留底，请先完成 04 步骤 2「逐条确认特征清单」。'
          : (!names.length ? '没有带出确认清单，可在下面点「＋ 添加一条」自己补。'
            : '自己的主副图 URL 不可用，请回 04 检查商品档案。'))
        + '</div>'
      : '';
    var notes = d.reviewNotes || [];
    var notesHtml = '<div class="step-meta"><b>本任务的竞对差评原文（只读参考）</b></div>'
      + (notes.length
        ? '<div class="f05-reviews">' + notes.map(function (n) {
            return '<div class="f05-reviews-one"><div class="f05-reviews-asin">'
              + esc(n.asin || '未指定 ASIN') + '</div><div class="f05-reviews-text">'
              + esc(n.reviews || '') + '</div></div>';
          }).join('') + '</div>'
        : '<div class="step-meta">本任务没有登记差评原文。换了 ASIN／竞对时，请回「提交任务」页按竞对补填，再对照它改写下面的清单；不填也能直接改清单。</div>');
    var warn = d.checklistInherited
      ? '<div class="f05-warn">清单来源：<b>' + esc(d.checklistSource || '上次定稿')
        + '</b>（继承来的，不是本任务定稿）'
        + (notes.length ? '；本任务已填 ' + notes.length + ' 家差评原文，请逐条改写后再确认，避免新 ASIN 沿用旧差评。'
          : '；若换了品类，请按新竞对的差评改写后再确认。') + '</div>'
      : '';
    return blocked
      + '<div class="step-meta">' + esc(d.note || '') + '</div>'
      + '<div class="step-meta">' + esc(d.sourceNote || '') + '</div>'
      + notesHtml + warn
      + '<div class="f05-wrap"><table class="mini f05"><thead><tr>'
      + '<th>竞对</th><th>是否跑</th><th>跳过原因</th><th>图片</th><th>进度</th></tr></thead><tbody>'
      + (comps || '<tr><td colspan="5">04 留底里没有竞对</td></tr>') + '</tbody></table></div>'
      + '<div class="f05-wrap f05-cl-wrap" style="margin-top:8px"><table class="mini f05 f05-edit"><thead><tr>'
      + '<th>确认清单（定稿，可编辑；改了要素名会重跑自家图）</th><th>英文说法</th>'
      + '<th>来源（写实）</th><th>买家为什么必须确认它才敢下单</th><th>操作</th>'
      + '</tr></thead><tbody data-role="f05-cl-body">'
      + (rows || '<tr><td colspan="5">暂无清单留底</td></tr>') + '</tbody></table></div>'
      + '<div class="btn-row" style="margin-top:8px">'
      + '<button class="btn btn-sm" type="button" data-f05-add>＋ 添加一条</button>'
      + '<button class="btn btn-sm btn-ghost" type="button" data-f05-reset>恢复带出的清单</button></div>'
      + '<div class="f05-count" data-role="f05-count"></div>'
      + '<div class="form-grid" style="margin-top:8px">'
      + '<label>全部跑完自动发布并点亮 05<input type="checkbox" data-f05-auto style="width:auto;margin-top:6px"'
      + (autoPub ? ' checked' : '') + '></label>'
      + '<label>口径差异处理<input type="text" value="原始留底（两次感知各自留底，不强行统一）" disabled></label>'
      + '</div><div class="step-meta">' + esc(d.rule || '') + ' · 只传图片 URL，不下载图片；模型只做感知，比较与建议由代码规则汇总。</div>';
  }

  function f05Count(card) {
    var run = 0, skip = 0, missing = 0, done = 0;
    Array.prototype.forEach.call(card.querySelectorAll('[data-f05-run]'), function (cb) {
      var isDone = cb.getAttribute('data-f05-done') === '1';
      if (isDone) done++;
      if (cb.checked) { run++; if (!isDone) missing++; } else skip++;
    });
    var needSelf = card.getAttribute('data-f05-self-done') !== '1';
    var box = card.querySelector('[data-role="f05-count"]');
    if (!box) return;
    box.textContent = '竞对：跑 ' + run + ' 家 / 跳过 ' + skip + ' 家；已完成 ' + done
      + ' 家留底复用不重复扣费。本次预计新增视觉请求：' + (needSelf ? '自家 1 次 ＋ ' : '自家 0 次（复用）＋ ')
      + missing + ' 家同框，图次随各家实际图片数计。';
    if (clChanged(card)) {
      box.textContent += ' ⚠ 清单已改动：要素名变了会让自家整组图重跑、各家同框留底失效（每家最多整批重跑 2 次）；只改来源／理由不会重跑视觉，只更新报告文字。';
    }
  }

  // 06 润色：动作清单只读（结论由纯函数按 rules.json 硬算），用户只确认「要不要花 1 次模型润理由」。
  function polishForm06(step) {
    var d = step.draft || {};
    var acts = d.actions || [];
    if (!d.ready) {
      return '<div class="quota-box">还不能润色：'
        + esc(!d.rulesReady ? '缺 rules.json 定稿，请先在步骤 1「确认判断规矩」里确认。'
          : '步骤 1 还没出动作清单 ad-plan.json，请先确认规矩并跑出零付费动作清单。')
        + '</div><div class="step-meta">' + esc(d.note || '') + '</div>';
    }
    var rows = acts.map(function (a, i) {
      return '<tr><td>' + esc(a.order == null ? i + 1 : a.order) + '</td>'
        + '<td>' + esc(a.keyword) + '</td>'
        + '<td>' + esc(a.action) + '<div class="f06-reason">' + esc(a.ruleId || '') + '</div></td>'
        + '<td>' + esc(a.evidence || '') + '</td>'
        + '<td><div class="f06-reason">' + esc(a.reason || '') + '</div></td>'
        + '<td><span class="f06-src">' + esc(a.reasonSource || '') + '</span></td></tr>';
    }).join('');
    var doneNote = d.polished
      ? '<div class="step-meta">本任务的理由已润色过（模型 ' + esc(d.modelName || '未登记')
        + '），不重复扣费；若规矩改过，请先在步骤 1 重跑零付费动作清单，再回来润色。</div>'
      : '';
    var check = d.polished ? ''
      : '<label class="f06-check"><input type="checkbox" data-f06-confirm>'
        + '我已看清上面 ' + acts.length + ' 条动作：这次只把理由润成一句人话，'
        + '动作、力度与排序一字不动；理由必须原样带 ACOS／点击／自然位数字。</label>';
    return doneNote
      + '<div class="step-meta">' + esc(d.note || '') + '</div>'
      + '<div class="f06-wrap"><table class="mini f06"><thead><tr>'
      + '<th>#</th><th>关键词</th><th>动作 / 规矩</th><th>依据（投产指标＋自然位）</th>'
      + '<th>当前理由</th><th>来源</th></tr></thead><tbody>'
      + (rows || '<tr><td colspan="6">动作清单为空</td></tr>') + '</tbody></table></div>'
      + '<div class="f06-count">动作 ' + esc(d.actionCount) + ' 条 · 待我判 '
      + esc(d.pendingCount) + ' 条 · 规矩版本 ' + esc(d.rulesVersion || '未登记') + '。'
      + esc(d.rule || '') + '</div>'
      + '<div class="step-meta">' + esc(d.sourceNote || '') + '</div>' + check;
  }

  function quotaBox(step) {
    if (step.status !== '失败') return '';
    var code = step.error_code || 'UNKNOWN';
    var isQuota = /QUOTA|PHASE1_INCOMPLETE/.test(code);
    var head = isQuota ? '额度不足 / 阶段一未完成'
      : (code === 'DECISION_INVALID' ? '确认内容不合格'
        : (code === 'VISION_STEP_FAILED' ? '看图没跑完（只补跑缺的那家）'
          : (code === 'POLISH_PRECONDITION' ? '06 润色前置不合格（回步骤 1 重跑动作清单）'
            : '这一步失败（' + esc(code) + '）')));
    return '<div class="quota-box">' + head + '：' + esc(step.error_reason || '') + '</div>';
  }

  function renderStep(step) {
    var k = step.module + '/' + step.step;
    var meta = STEP_META[k] || { seq: 0, name: step.step };
    var d = step.draft || {};
    var ready04 = k === '04/confirm' && d.ready === true && !!(d.items || []).length;
    var ready05 = k === '05/batch' && d.ready === true && !!(d.checklistNames || []).length;
    // 06 润色是可选付费步骤：只有「待确认」且动作清单齐、还没润过才给提交；已润色不重复扣费。
    var ready06 = k === '06/polish' && d.ready === true && !!(d.actions || []).length && !d.polished;
    var canWrite = ['待确认', '已完成'].indexOf(step.status) >= 0
      && (k === '06/rules' || ready04 || ready05 || (ready06 && step.status === '待确认'));
    var body = '';
    if (k === '06/rules') body = rulesForm(step);
    else if (k === '04/confirm') body = confirmForm04(step);
    else if (k === '05/batch') body = batchForm05(step);
    else if (k === '06/polish') body = polishForm06(step);
    else if (k === '04/phase1') {
      body = '<div class="step-meta">自己 ASIN ' + esc((step.draft || {}).asin || '') + '，竞对 '
        + esc(((step.draft || {}).competitorAsins || []).join('、') || '无') + '；核心词 '
        + esc((step.draft || {}).coreKeyword || '') + '</div>';
    }
    var btn = '';
    if (step.status === '失败') {
      // 04 失败后允许按「当前表里重新选好的判定」再提交一次，不用沿用上次那份不合规格的 decision
      if (k === '04/confirm' && ready04) {
        btn = '<button class="btn btn-primary btn-sm" type="button" data-approve="' + esc(step.id) + '">按当前判定重新确认并重试 04</button>';
      } else if (k === '05/batch' && ready05) {
        btn = '<button class="btn btn-primary btn-sm" type="button" data-retry="' + esc(step.id) + '">只补跑未完成的家（单项重试）</button>'
          + '<button class="btn btn-sm" type="button" data-approve="' + esc(step.id) + '">改清单/竞对后重新确认 05</button>';
      } else {
        btn = '<button class="btn btn-sm" type="button" data-retry="' + esc(step.id) + '">单项重试本步骤</button>';
      }
    } else if (canWrite) {
      var label = k === '04/confirm'
        ? (step.status === '已完成' ? '改判定并重跑 04（再花 DeepSeek 1 次）' : '确认清单并点亮 04（DeepSeek 1 次）')
        : (k === '05/batch'
          ? (step.status === '已完成' ? '改清单/竞对并重跑 05（会再花视觉请求）' : '一次确认并跑完 05（只补跑未完成的家）')
          : (k === '06/polish'
            ? '确认并润色理由（DeepSeek 1 次，动作不变）'
            : (step.status === '已完成' ? '保存规矩并重跑（零付费）' : '确认并出 06 动作清单（零付费）')));
      btn = '<button class="btn btn-primary btn-sm" type="button" data-approve="' + esc(step.id) + '">'
        + label + '</button>';
    } else if (step.status === '未开放') {
      var phase = (step.module === '06' ? 'P4' : 'P2');
      var text = (k === '04/confirm') ? '先完成步骤 1（竞对资料与草案）'
        : (k === '05/batch' ? '先点亮 04（竞对对比）'
          : (k === '06/polish' ? '先在步骤 1 出 06 动作清单' : phase + ' 开放提交'));
      btn = '<button class="btn btn-sm" type="button" disabled>' + text + '</button>';
    }
    return '<div class="step-card" data-step="' + esc(k) + '" data-step-id="' + esc(step.id) + '"'
      + ' data-f04-total="' + esc((d.items || []).length)
      + '" data-f05-self-done="' + ((d.progress && d.progress.selfDone) ? '1' : '0') + '">'
      + '<div class="step-head">'
      + (meta.seq ? '<span class="step-seq">步骤 ' + meta.seq + '</span>' : '')
      + '<span class="step-name">' + esc(meta.name) + '</span>' + tag(step.status) + '</div>'
      + '<div class="step-meta est">' + estimateText(step.estimate) + '</div>'
      + quotaBox(step) + actualText(step.actual) + body
      + '<div class="btn-row">' + btn + '</div></div>';
  }

  function render(rows) {
    var groups = { '01': [], '02': [], '03': [], '04': [], '05': [], '06': [] };
    stepMap = {};
    rows.forEach(function (s) {
      stepMap[s.id] = s;
      if (groups[s.module]) groups[s.module].push(s);
    });
    var names = { '01': '关键词作战总表', '02': '自然位标杆', '03': '否定词清单',
      '04': '竞对对比', '05': '图片与卖点诊断', '06': '广告诊断与优化' };
    var subs = {
      '01': '上传后自动生成，无需确认',
      '02': '上传后自动生成，无需确认',
      '03': '上传后自动生成，无需确认',
      '04': '资料清洗 → 特征清单确认 → 竞对对比',
      '05': '自家图 ＋ 逐家竞对同框看图 → 图片诊断',
      '06': '规矩确认 → 动作清单 → 理由润色'
    };
    // 分组头只报汇总，不再把各步状态用「/」拼成一长串
    function summaryOf(list) {
      if (!list.length) return { prog: '', cls: 'mod-sum-off', text: '暂无步骤' };
      var st = list.map(function (s) { return s.status; });
      var active = st.filter(function (x) { return x !== '跳过'; });
      var done = st.filter(function (x) { return x === '已完成'; }).length;
      var fail = st.filter(function (x) { return x === '失败'; }).length;
      var wait = st.filter(function (x) { return x === '待确认'; }).length;
      var prog = active.length ? done + ' / ' + active.length + ' 已完成' : '本任务不适用';
      if (fail) return { prog: prog, cls: 'mod-sum-fail', text: fail + ' 项失败待处理' };
      if (wait) return { prog: prog, cls: 'mod-sum-wait', text: wait + ' 项待你确认' };
      if (active.length && done === active.length) return { prog: prog, cls: 'mod-sum-ok', text: '全部完成' };
      return { prog: prog, cls: 'mod-sum-off', text: '后续阶段开放' };
    }

    var out = '';
    Object.keys(groups).forEach(function (m) {
      var list = groups[m];
      var auto = (m === '01' || m === '02' || m === '03');
      var sum = auto ? { prog: '', cls: 'mod-sum-ok', text: '已出 · 自动' } : summaryOf(list);
      out += '<div class="mod-group' + (auto ? ' mod-group-auto' : '') + '" data-module="' + m + '">'
        + '<div class="mod-head">'
        + '<span class="mod-num">' + m + '</span>'
        + '<div class="mod-title-wrap"><div class="mod-title">' + esc(names[m]) + '</div>'
        + '<div class="mod-sub">' + esc(subs[m]) + '</div></div>'
        + '<div class="mod-side">'
        + (sum.prog ? '<span class="mod-progress">' + esc(sum.prog) + '</span>' : '')
        + '<span class="mod-sum ' + sum.cls + '">' + esc(sum.text) + '</span>'
        + '</div></div>';
      if (list.length) {
        out += '<div class="mod-body">';
        list.slice().sort(function (a, b) {
          return (STEP_ORDER[a.module + '/' + a.step] || 9)
            - (STEP_ORDER[b.module + '/' + b.step] || 9);
        }).forEach(function (s) { out += renderStep(s); });
        out += '</div>';
      }
      out += '</div>';
    });
    stepsBox.innerHTML = out;

    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-retry]'), function (b) {
      b.onclick = function () { submit('retry_module_step', { p_step_id: b.getAttribute('data-retry') }, b); };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-approve]'), function (b) {
      b.onclick = function () {
        var k = b.closest('.step-card').getAttribute('data-step');
        if (k === '04/confirm') approve04(b);
        else if (k === '05/batch') approve05(b);
        else if (k === '06/polish') approve06Polish(b);
        else approve06(b);
      };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-rule-num],[data-rule-text]'), function (el) {
      el.onchange = function () { syncRules(el); markDirty(); };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-role="rules-json"]'), function (el) {
      el.onfocus = function () { markDirty(); };
      el.oninput = function () { markDirty(); };
    });
    // 04 逐条确认：初始化计数、改动后暂停自动刷新（防 30 秒轮询把未提交的选择冲掉）
    Array.prototype.forEach.call(stepsBox.querySelectorAll('.step-card[data-step="04/confirm"]'), function (card) {
      f04Count(card);
      Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
        s.onchange = function () { f04Count(card); markDirty(); };
      });
      var reset = card.querySelector('[data-role="f04-reset"]');
      if (reset) reset.onclick = function () {
        Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
          s.value = s.getAttribute('data-f04-draft') || s.value;
        });
        f04Count(card);
        markDirty();
      };
    });
    // 05 一次确认：初始化补跑预估、清单编辑事件、勾掉「跑这家」才启用跳过原因、改动后暂停自动刷新
    Array.prototype.forEach.call(stepsBox.querySelectorAll('.step-card[data-step="05/batch"]'), function (card) {
      bindClEvents(card);
      f05Count(card);
      Array.prototype.forEach.call(card.querySelectorAll('[data-f05-run]'), function (cb) {
        cb.onchange = function () {
          var i = cb.getAttribute('data-f05-run');
          var box = card.querySelector('[data-f05-reason="' + i + '"]');
          if (box) box.disabled = cb.checked;
          f05Count(card);
          markDirty();
        };
      });
      Array.prototype.forEach.call(card.querySelectorAll('[data-f05-reason],[data-f05-auto]'), function (el) {
        el.onchange = function () { markDirty(); };
        el.oninput = function () { markDirty(); };
      });
    });
    // 06 润色：勾选确认后暂停自动刷新，避免 30 秒轮询把没提交的勾冲掉
    Array.prototype.forEach.call(stepsBox.querySelectorAll('.step-card[data-step="06/polish"]'), function (card) {
      Array.prototype.forEach.call(card.querySelectorAll('[data-f06-confirm]'), function (cb) {
        cb.onchange = function () { markDirty(); };
      });
    });
  }

  // 表单一旦被改过就暂停自动刷新，直到提交成功或点「手动刷新」恢复。
  function markDirty() {
    editing = true;
    document.getElementById('last-refresh').textContent = '已修改，自动刷新暂停（提交或点手动刷新恢复）';
  }

  function currentRulesJson(card) {
    var ta = card.querySelector('[data-role="rules-json"]');
    return ta ? ta.value : '';
  }
  function syncRules(el) {
    var card = el.closest('.step-card');
    var ta = card.querySelector('[data-role="rules-json"]');
    if (!ta) return;
    var r;
    try { r = JSON.parse(ta.value); } catch (e) { window.showMsg('msg', '规矩 JSON 暂时解析不了，先修好完整 JSON 再改快捷字段', 'err'); return; }
    var key = el.getAttribute('data-rule-num') || el.getAttribute('data-rule-text');
    if (el.getAttribute('data-rule-num')) r.thresholds[key] = Number(el.value);
    else if (key === 'trendMode') r.trendPolicy.mode = el.value;
    else r.answers[key] = el.value;
    ta.value = JSON.stringify(r, null, 2);
  }

  // 04 阶段二：把逐条选择汇总成 keep/drop/gap 三个名字数组，判定仍由后台按阶段一清单复核。
  function approve04(btn) {
    var card = btn.closest('.step-card');
    var sels = card.querySelectorAll('[data-f04-verdict]');
    var buckets = { keep: [], drop: [], gap: [] };
    var map = { '保留': 'keep', '剔除': 'drop', '缺口': 'gap' };
    Array.prototype.forEach.call(sels, function (s) {
      var b = map[s.value];
      if (b) buckets[b].push(s.getAttribute('data-f04-name'));
    });
    var total = buckets.keep.length + buckets.drop.length + buckets.gap.length;
    var expected = Number(card.getAttribute('data-f04-total') || 0);
    if (!total || (expected && total !== expected)) {
      window.showMsg('msg', '判定条数不对（应为 ' + expected + ' 条），请刷新页面后重新确认', 'err'); return;
    }
    submit('approve_module_step', {
      p_step_id: btn.getAttribute('data-approve'),
      p_decision: {
        keep: buckets.keep, drop: buckets.drop, gap: buckets.gap,
        confirmedFrom: '网页', confirmedAt: new Date().toISOString()
      }
    }, btn);
  }

  // 05 一次确认（P6）：发用户改写后的四样清单 ＋ 逐家跑/跳过 ＋ 是否自动发布；后台重新校验并写回本任务 checklist.json。
  function approve05(btn) {
    var id = btn.getAttribute('data-approve');
    var card = btn.closest('.step-card');
    var items = collectClItems(card);
    if (!items.length) {
      window.showMsg('msg', '确认清单一条都没有，点「＋ 添加一条」补上再提交', 'err'); return;
    }
    var err = '', seen = {};
    if (items.length > 20) err = '清单最多 20 条';
    for (var i = 0; i < items.length && !err; i++) {
      var it = items[i];
      if (!it.name) err = '第 ' + (i + 1) + ' 条还没写要素名';
      else if (seen[it.name]) err = '要素名重复：' + it.name;
      else if (it.name.length > 80 || it.en.length > 120 || it.source.length > 500 || it.why.length > 500) {
        err = '第 ' + (i + 1) + ' 条有字段超长（名字 80／英文 120／来源 500／理由 500 字）';
      } else if (/<script|javascript:/i.test(JSON.stringify(it))) err = '第 ' + (i + 1) + ' 条含脚本内容';
      if (it.name) seen[it.name] = 1;
    }
    if (err) { window.showMsg('msg', err, 'err'); return; }
    var comps = [];
    Array.prototype.forEach.call(card.querySelectorAll('[data-f05-run]'), function (cb) {
      var i = cb.getAttribute('data-f05-run');
      var reason = card.querySelector('[data-f05-reason="' + i + '"]');
      comps.push({ asin: cb.getAttribute('data-f05-asin'), run: cb.checked,
        reason: reason ? String(reason.value || '').trim() : '' });
    });
    var bad = comps.filter(function (c) { return !c.run && !c.reason; });
    if (bad.length) {
      window.showMsg('msg', '选了跳过就要写原因：' + bad.map(function (c) { return c.asin; }).join('、'), 'err'); return;
    }
    var changed = clChanged(card);
    if (changed && !window.confirm(
      '你已经改了确认清单。\n\n要素名变化会让自家整组图重新看一遍，已有竞对同框留底也会失效、需逐家重新看图（每家校验不过最多整批重跑 2 次）。按预估：自家 6 图 1 次视觉请求，每家竞对 12 图各 1 次。只改「来源／理由」而不改要素名，不会重跑视觉，只更新报告文字。\n\n确定按这份新清单提交吗？')) {
      return;
    }
    var auto = card.querySelector('[data-f05-auto]');
    submit('approve_module_step', {
      p_step_id: id,
      p_decision: {
        checklist: items, competitors: comps,
        autoPublish: auto ? auto.checked : true, reconcileMode: '原始留底',
        checklistEdited: changed,
        confirmedFrom: '网页', confirmedAt: new Date().toISOString()
      }
    }, btn);
  }

  // 06 润色：只提交一个「我确认要润理由」的标记；动作清单与规矩全由后台按留底重算，不信任前端内容。
  function approve06Polish(btn) {
    var id = btn.getAttribute('data-approve');
    var step = stepMap[id] || {};
    var d = step.draft || {};
    var card = btn.closest('.step-card');
    var cb = card.querySelector('[data-f06-confirm]');
    if (!cb || !cb.checked) {
      window.showMsg('msg', '请先勾选「只润理由、动作与排序一字不动」再确认', 'err'); return;
    }
    if (!d.ready || !(d.actions || []).length || d.polished) {
      window.showMsg('msg', '动作清单未就绪或已润色过，请刷新页面后再试', 'err'); return;
    }
    submit('approve_module_step', {
      p_step_id: id,
      p_decision: {
        polish: true, reasonOnly: true, actionCount: d.actions.length,
        rulesVersion: String(d.rulesVersion || ''),
        confirmedFrom: '网页', confirmedAt: new Date().toISOString()
      }
    }, btn);
  }

  function approve06(btn) {
    var card = btn.closest('.step-card');
    var raw = currentRulesJson(card);
    var rules;
    try { rules = JSON.parse(raw); } catch (e) { window.showMsg('msg', '规矩 JSON 格式不对：' + e.message, 'err'); return; }
    if (!rules || !rules.rules || !rules.thresholds) {
      window.showMsg('msg', '规矩缺 rules / thresholds，不能提交', 'err'); return;
    }
    submit('approve_module_step', {
      p_step_id: btn.getAttribute('data-approve'),
      p_decision: { rules: rules, confirmedFrom: '网页', confirmedAt: new Date().toISOString() }
    }, btn);
  }

  async function submit(fn, args, btn) {
    if (btn) btn.disabled = true;
    window.showMsg('msg', '正在提交…', 'info');
    try {
      var r = await window.sb.rpc(fn, args);
      if (r.error) throw r.error;
      var okMsg = fn === 'retry_module_step'
        ? '已登记单项重试，工人会在 30 秒内领取（05 只补跑未完成的家，已完成留底复用不重复扣费）'
        : (args.p_decision && args.p_decision.keep
          ? '确认已提交：工人会按你逐条确认的判定跑 04（DeepSeek 1 次），完成后报告自动点亮 04'
          : (args.p_decision && args.p_decision.competitors
            ? '05 一次确认已提交：自家整组图 → 逐家串行同框，每跑完一家立刻落盘；全部跑完自动发布并点亮 05'
            : (args.p_decision && args.p_decision.polish
              ? '润色确认已提交：DeepSeek 1 次，只写理由字段；动作结论与排序一字不动，报告会自动刷新'
              : '确认已提交，工人会在 30 秒内执行')));
      window.showMsg('msg', okMsg, 'ok');
      editing = false;
      await load();
    } catch (ex) {
      window.showMsg('msg', '提交失败：' + window.humanError(ex), 'err');
      if (btn) btn.disabled = false;
    }
  }

  async function load() {
    if (!taskId) { window.showMsg('msg', '网址里没有任务号，从工具页点「模块进度」进来', 'err'); return; }
    if (editing) return;   // 正在编辑规矩时不被自动刷新打断
    var t = await window.sb.from(C.TASK_TABLE).select('*').eq('id', taskId).maybeSingle();
    if (t.error) { window.showMsg('msg', '读取任务失败：' + window.humanError(t.error), 'err'); return; }
    if (!t.data) { window.showMsg('msg', '没找到这个任务', 'err'); return; }
    var task = t.data;
    document.getElementById('meta').textContent = 'ASIN ' + task.asin + ' · 提交于 '
      + window.fmtTime(task.created_at) + ' · 状态：' + task.status + ' · 报告版本：' + (task.report_revision || 0);
    document.getElementById('report-link').innerHTML = task.report_url
      ? '<a class="btn btn-sm" href="' + window.APP_BASE + 'report/?task=' + encodeURIComponent(task.id) + '">查看报告（点亮后自动刷新）</a>'
      : '<span class="muted">报告还在生成中</span>';

    var r = await window.sb.from(C.STEP_TABLE || 'module_steps').select('*')
      .eq('task_id', taskId).order('module', { ascending: true }).order('step', { ascending: true });
    if (r.error) {
      stepsBox.innerHTML = '<div class="quota-box">读不到模块步骤：' + esc(window.humanError(r.error))
        + '。若是刚上线，请确认数据库脚本 05_模块步骤表与门禁.sql 已执行。</div>';
      return;
    }
    render(r.data || []);
    focusOnce();
    document.getElementById('last-refresh').textContent = '最后刷新 ' + new Date().toLocaleTimeString('zh-CN');
  }

  document.getElementById('btn-refresh').onclick = function () { editing = false; load(); };
  (async function () {
    session = await window.requireSession();
    if (!session) return;
    window.mountHeader('模块进度');
    await load();
    setInterval(load, C.REFRESH_MS || 30000);
  })();
})();
</script>
