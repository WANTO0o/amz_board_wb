<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模块进度 · 关键词作战台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* ===== 模块分组：标题条（父）＋ 缩进步骤区（子），层次一眼可分 ===== */
  .mod-group { margin: 20px 0 0; }
  .mod-group:first-child { margin-top: 4px; }
  .mod-group-auto { margin-top: 10px; }
  .mod-head {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border:1px solid #d8e2f2; border-radius:10px; background:#eef3fb;
  }
  .mod-num {
    flex:0 0 34px; width:34px; height:34px; border-radius:8px;
    background:#2563eb; color:#fff; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; letter-spacing:.5px;
  }
  .mod-title-wrap { flex:1; min-width:0; }
  .mod-title { font-size:15px; font-weight:600; color:#1f2937; line-height:1.3; }
  .mod-sub { font-size:11.5px; color:#6b7280; margin-top:3px; line-height:1.4; }
  .mod-side { flex:0 0 auto; display:flex; align-items:center; gap:10px; }
  .mod-progress { font-size:11.5px; color:#5f6b7f; white-space:nowrap; }
  .mod-sum { font-size:11.5px; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .mod-sum-ok { background:#e8f5ee; color:#0f7a4d; }
  .mod-sum-fail { background:#fdeceb; color:#b02a20; }
  .mod-sum-wait { background:#fdf3e2; color:#a35b06; }
  .mod-sum-off { background:#e7ebf1; color:#475569; }

  /* 子步骤区：左侧竖线＋连接短线＋整体缩进，明确从属于上面的分组 */
  .mod-body { margin:10px 0 0 16px; padding:0 0 0 24px; border-left:2px solid #d8e2f2; }
  .step-card {
    position:relative; border:1px solid #e2e6ec; border-radius:8px;
    padding:14px 16px; margin:0 0 10px; background:#fff;
    box-shadow:0 1px 2px rgba(16,24,40,.03);
  }
  .step-card:last-child { margin-bottom:2px; }
  .step-card::before {
    content:''; position:absolute; left:-26px; top:23px; width:26px; height:2px; background:#d8e2f2;
  }
  .step-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .step-seq {
    font-size:11px; font-weight:600; color:#1d4ed8; background:#e8efff;
    border-radius:5px; padding:2px 7px; white-space:nowrap;
  }
  .step-name { font-size:14px; font-weight:600; color:#1f2937; }
  .step-tag { font-size:11.5px; padding:2px 9px; border-radius:999px; border:1px solid rgba(0,0,0,.10); }
  .st-done { background:#eaf3de; color:#27500a; }
  .st-wait { background:#faeeda; color:#633806; }
  .st-run { background:#e6f1fb; color:#0c447c; }
  .st-fail { background:#fcebeb; color:#791f1f; }
  .st-off { background:#f1efe8; color:#5f5e5a; }
  /* 实际消耗里含整段 JSON，窄屏必须允许断行，否则会把整页撑出横向滚动 */
  .step-meta { font-size:12px; color:#5f5e5a; margin:8px 0; line-height:1.7; overflow-wrap:anywhere; word-break:break-word; }
  .step-meta.est { color:#475569; }
  .quota-box { border-left:3px solid #a32d2d; background:#fcebeb; color:#791f1f; padding:10px 12px; border-radius:6px; font-size:13px; line-height:1.7; margin:10px 0; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin:10px 0; }
  .form-grid label { display:block; font-size:12px; color:#444; }
  .form-grid input, .form-grid select, .form-grid textarea { width:100%; box-sizing:border-box; margin-top:4px; }
  textarea.rules-json { width:100%; box-sizing:border-box; min-height:170px; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.5; }
  table.mini { width:100%; border-collapse:collapse; font-size:13px; }
  table.mini th, table.mini td { border-bottom:1px solid rgba(0,0,0,.08); padding:6px 8px; text-align:left; vertical-align:top; }
  .draft-box { background:#f8f9fb; border-radius:8px; padding:10px 12px; font-size:12px; max-height:260px; overflow:auto; }
  /* 04 阶段二：逐条确认表 */
  .f04-wrap { background:#f8f9fb; border:1px solid #e6eaf1; border-radius:8px; padding:6px 10px 10px; max-height:430px; overflow:auto; }
  table.f04 { width:100%; border-collapse:collapse; font-size:12.5px; min-width:620px; }
  table.f04 th, table.f04 td { border-bottom:1px solid rgba(0,0,0,.07); padding:7px 8px; text-align:left; vertical-align:top; }
  table.f04 th { position:sticky; top:0; background:#f8f9fb; color:#475569; font-weight:600; white-space:nowrap; }
  table.f04 select { width:100%; min-width:86px; box-sizing:border-box; }
  .f04-desc { font-size:11px; color:#6b7280; line-height:1.45; margin-top:3px; max-width:340px; overflow-wrap:anywhere; }
  .f04-draft { font-size:11.5px; padding:1px 7px; border-radius:999px; background:#e8efff; color:#1d4ed8; white-space:nowrap; }
  .f04-count { font-size:12px; color:#475569; margin:8px 0 0; line-height:1.6; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  @media (max-width:620px) {
    .form-grid { grid-template-columns:1fr; }
    .mod-head { flex-wrap:wrap; }
    .mod-side { width:100%; justify-content:flex-end; }
    .mod-body { margin-left:10px; padding-left:14px; }
    .step-card::before { left:-16px; width:16px; }
  }
</style>
</head>
<body>
<header class="app-header" id="app-header"></header>
<main class="wrap">
  <section class="card">
    <div class="card-head">
      <h2>模块进度与确认</h2>
      <span class="spacer"></span>
      <a class="btn btn-sm" id="back" href="#">返回工具页</a>
    </div>
    <p class="desc" id="meta">正在读取任务…</p>
    <p id="msg" class="msg" hidden></p>
    <div id="report-link"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>六个模块</h2>
      <span class="muted" id="last-refresh" style="font-size:12px"></span>
      <span class="spacer"></span>
      <button id="btn-refresh" class="btn btn-sm" type="button">手动刷新</button>
    </div>
    <p class="field-note">01–03 上传后自动生成。04–06 需要你在这一页确认：先看预估调用量，点确认后后台才开始花钱；任何一步失败都只重试那一步，不影响别的模块。报告链接始终不变，点亮后会自动刷新。</p>
    <div id="steps">加载中…</div>
  </section>
</main>
<script src="../assets/config.js"></script>
<script src="../assets/supabase.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG;
  var taskId = new URLSearchParams(location.search).get('task');
  var stepsBox = document.getElementById('steps');
  var session = null;
  var editing = false;

  // 步骤显示名与先后顺序：按业务流程排，不按 step 字段的字母序
  var STEP_META = {
    '04/phase1':  { seq: 1, name: '竞对资料与清洗草案' },
    '04/confirm': { seq: 2, name: '逐条确认特征清单' },
    '05/batch':   { seq: 0, name: '一次确认并发布图片诊断' },
    '06/rules':   { seq: 1, name: '确认判断规矩' },
    '06/polish':  { seq: 2, name: '润色理由' }
  };
  var STEP_ORDER = { '04/phase1': 1, '04/confirm': 2, '05/batch': 1, '06/rules': 1, '06/polish': 2 };

  document.getElementById('back').href = window.APP_BASE + 'tool/';

  function esc(s) { return window.esc(s); }
  function tag(status) {
    var cls = { '已完成': 'st-done', '待确认': 'st-wait', '已批准': 'st-run', '执行中': 'st-run',
      '失败': 'st-fail', '跳过': 'st-off', '未开放': 'st-off' }[status] || 'st-off';
    return '<span class="step-tag ' + cls + '">' + esc(status) + '</span>';
  }
  function estimateText(e) {
    if (!e) return '本步没有预估信息';
    if (e.paid === false || e.requests === 0) return '零付费：' + esc(e.note || '不调任何外部接口');
    var bits = [];
    if (e.sorftimeCli) bits.push('sorftime 商品档案 ' + e.sorftimeCli + ' 次');
    if (e.sorftimeMcp) bits.push('品类特征 MCP ' + e.sorftimeMcp + ' 次');
    if (e.deepseek) bits.push('DeepSeek ' + e.deepseek + ' 次');
    if (e.visionRequests) bits.push('视觉 ' + e.visionRequests + ' 请求 / ' + e.images + ' 图次');
    return '预计：' + bits.join(' ＋ ') + (e.note ? '。' + esc(e.note) : '');
  }
  function actualText(a) {
    if (!a || !Object.keys(a).length) return '';
    var bits = [];
    Object.keys(a).forEach(function (k) {
      if (k === 'reportUrl' || k === 'note') return;
      bits.push(k + '=' + (typeof a[k] === 'object' ? JSON.stringify(a[k]) : a[k]));
    });
    return '<div class="step-meta">实际消耗：' + esc(bits.join(' · ')) + (a.note ? '。' + esc(a.note) : '') + '</div>';
  }

  function rulesForm(step) {
    var d = (step.draft || {});
    var r = d.rules || {};
    var t = r.thresholds || {};
    var ans = r.answers || {};
    var tp = r.trendPolicy || {};
    var num = function (k, label, stepAttr) {
      return '<label>' + esc(label) + '<input type="number" step="' + (stepAttr || 'any') + '" data-rule-num="' + esc(k) + '" value="' + esc(t[k]) + '"></label>';
    };
    return '<div class="step-meta">' + esc(d.sourceNote || '默认带出上次定稿，编辑后仍需点确认才生效') + '</div>'
      + '<div class="form-grid">'
      + num('topRankMax', '前三判定（名次 ≤）') + num('deepRankMin', '深位起始（名次 ≥）')
      + num('acosLow', 'ACOS 低档（≤）') + num('acosHigh', 'ACOS 高档（>）')
      + num('crGood', '转化好（≥）') + num('crBad', '转化差（<）')
      + num('observeDays', '观察天数')
      + '<label>趋势数据口径<select data-rule-text="trendMode">'
      + '<option value="single-snapshot"' + (tp.mode === 'single-snapshot' ? ' selected' : '') + '>只有单次快照 → 待我判</option>'
      + '<option value="multi-snapshot"' + (tp.mode === 'multi-snapshot' ? ' selected' : '') + '>有多日位次 → 启用爬升判定</option>'
      + '</select></label>'
      + '</div>'
      + '<div class="form-grid">'
      + '<label>Q1 前三降不降<textarea rows="2" data-rule-text="Q1">' + esc(ans.Q1 || '') + '</textarea></label>'
      + '<label>Q2 深位/未上榜<textarea rows="2" data-rule-text="Q2">' + esc(ans.Q2 || '') + '</textarea></label>'
      + '<label>Q3 ACOS 高但在爬<textarea rows="2" data-rule-text="Q3">' + esc(ans.Q3 || '') + '</textarea></label>'
      + '</div>'
      + '<details><summary style="cursor:pointer;font-size:12px;color:#5f5e5a">高级：查看/编辑完整规矩 JSON</summary>'
      + '<textarea class="rules-json" data-role="rules-json" spellcheck="false">' + esc(JSON.stringify(r, null, 2)) + '</textarea></details>';
  }

  // 04 阶段二：默认带出阶段一清洗草案，三档逐条可改；提交只发 keep/drop/gap 三个名字数组。
  function confirmForm04(step) {
    var d = step.draft || {};
    var items = d.items || [];
    if (!items.length) {
      return '<div class="draft-box">阶段一还没有出清洗草案（可能卡在额度），先完成步骤 1：有失败就点「单项重试本步骤」。</div>';
    }
    if (!d.ready) {
      return '<div class="quota-box">竞对档案不齐，不能确认：'
        + esc((d.missingProductData || []).join('、') || ('档案 ' + (d.profiles || 0) + ' 行'))
        + '。请回步骤 1 补抓缺的 ASIN。</div>';
    }
    var rows = items.map(function (x, i) {
      var v = String(x.verdict || '保留');
      // 「你的判定」放第 2 列：宽表要横滚时，用户不用先滚到最右边才能改判定。
      return '<tr><td>' + (i + 1) + '</td>'
        + '<td><select data-f04-verdict="' + i + '" data-f04-name="' + esc(x.name)
        + '" data-f04-draft="' + esc(v) + '">'
        + ['保留', '剔除', '缺口'].map(function (o) {
          return '<option value="' + o + '"' + (o === v ? ' selected' : '') + '>' + o + '</option>';
        }).join('') + '</select></td>'
        + '<td><div>' + esc(x.name) + '</div><div class="f04-desc">' + esc(x.description || '') + '</div></td>'
        + '<td>' + (x.productShare == null ? '—' : esc(x.productShare) + '%') + ' / '
        + (x.salesShare == null ? '—' : esc(x.salesShare) + '%') + '</td>'
        + '<td><span class="f04-draft">' + esc(v) + '</span>'
        + '<div class="f04-desc">' + esc(x.reason || '') + '</div></td></tr>';
    }).join('');
    return '<div class="step-meta">' + esc(d.sourceNote || '') + '</div>'
      + '<div class="step-meta">' + esc(d.note || '') + ' · 竞对档案 ' + esc(d.profiles) + ' 行</div>'
      + '<div class="f04-wrap"><table class="mini f04"><thead><tr>'
      + '<th>#</th><th>你的判定</th><th>品类特征 / 说明</th><th>占比 产品 / 销量</th><th>草案判定 / 理由</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
      + '<div class="f04-count" data-role="f04-count"></div>'
      + '<div class="btn-row"><button class="btn btn-sm" type="button" data-role="f04-reset">全部恢复为草案判定</button></div>'
      + '<div class="step-meta">' + esc(d.rule || '') + '</div>';
  }

  function f04Count(card) {
    var n = { '保留': 0, '剔除': 0, '缺口': 0 };
    Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
      if (n[s.value] != null) n[s.value]++;
    });
    var box = card.querySelector('[data-role="f04-count"]');
    if (box) box.textContent = '共 ' + (n['保留'] + n['剔除'] + n['缺口']) + ' 条：保留 '
      + n['保留'] + ' / 剔除 ' + n['剔除'] + ' / 缺口 ' + n['缺口']
      + '。剔除的不参与对比，保留＋缺口会逐方对照各家 listing 原话。';
  }

  function batchForm05(step) {
    var d = step.draft || {};
    var cl = d.checklist || [];
    var rows = cl.map(function (x, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(x.name || '') + '</td><td>' + esc(String(x.source || x.intent || '')) + '</td></tr>';
    }).join('');
    var comps = (d.competitors || []).map(function (c) {
      return '<tr><td>' + esc(c.asin) + '</td><td><input type="checkbox" disabled' + (c.run ? ' checked' : '') + '> 跑这家</td>'
        + '<td><input type="text" disabled placeholder="跳过原因（选填）"></td></tr>';
    }).join('');
    return '<div class="step-meta">一次确认覆盖：清单 7 条 ＋ 自家图 ＋ 逐家竞对跑/跳过 ＋ 发布；内部仍逐家串行执行，任何一家失败只重试那一家。</div>'
      + '<div class="draft-box"><table class="mini"><thead><tr><th>#</th><th>确认要素</th><th>来源</th></tr></thead><tbody>'
      + (rows || '<tr><td colspan="3">暂无清单留底</td></tr>') + '</tbody></table></div>'
      + '<div class="draft-box" style="margin-top:8px"><table class="mini"><thead><tr><th>竞对</th><th>是否跑</th><th>跳过原因</th></tr></thead><tbody>'
      + (comps || '<tr><td colspan="3">这条任务没有竞对 ASIN</td></tr>') + '</tbody></table></div>'
      + '<div class="form-grid" style="margin-top:8px">'
      + '<label>口径差异处理<select disabled><option>' + esc(d.reconcileMode || '原始留底') + '</option><option>统一到第二步定稿</option></select></label>'
      + '<label>全部跑完自动发布<input type="checkbox" disabled' + (d.autoPublish ? ' checked' : '') + '></label>'
      + '</div><div class="step-meta">P3 开放提交；届时会一次点完，不再一家一家停下来确认。</div>';
  }

  function quotaBox(step) {
    if (step.status !== '失败') return '';
    var code = step.error_code || 'UNKNOWN';
    var isQuota = /QUOTA|PHASE1_INCOMPLETE/.test(code);
    var head = isQuota ? '额度不足 / 阶段一未完成'
      : (code === 'DECISION_INVALID' ? '确认内容不合格' : '这一步失败（' + esc(code) + '）');
    return '<div class="quota-box">' + head + '：' + esc(step.error_reason || '') + '</div>';
  }

  function renderStep(step) {
    var k = step.module + '/' + step.step;
    var meta = STEP_META[k] || { seq: 0, name: step.step };
    var d = step.draft || {};
    var ready04 = k === '04/confirm' && d.ready === true && !!(d.items || []).length;
    var canWrite = ['待确认', '已完成'].indexOf(step.status) >= 0 && (k === '06/rules' || ready04);
    var body = '';
    if (k === '06/rules') body = rulesForm(step);
    else if (k === '04/confirm') body = confirmForm04(step);
    else if (k === '05/batch') body = batchForm05(step);
    else if (k === '04/phase1') {
      body = '<div class="step-meta">自己 ASIN ' + esc((step.draft || {}).asin || '') + '，竞对 '
        + esc(((step.draft || {}).competitorAsins || []).join('、') || '无') + '；核心词 '
        + esc((step.draft || {}).coreKeyword || '') + '</div>';
    }
    var btn = '';
    if (step.status === '失败') {
      // 04 失败后允许按「当前表里重新选好的判定」再提交一次，不用沿用上次那份不合规格的 decision
      btn = (k === '04/confirm' && ready04)
        ? '<button class="btn btn-primary btn-sm" type="button" data-approve="' + esc(step.id) + '">按当前判定重新确认并重试 04</button>'
        : '<button class="btn btn-sm" type="button" data-retry="' + esc(step.id) + '">单项重试本步骤</button>';
    } else if (canWrite) {
      var label = k === '04/confirm'
        ? (step.status === '已完成' ? '改判定并重跑 04（再花 DeepSeek 1 次）' : '确认清单并点亮 04（DeepSeek 1 次）')
        : (step.status === '已完成' ? '保存规矩并重跑（零付费）' : '确认并出 06 动作清单（零付费）');
      btn = '<button class="btn btn-primary btn-sm" type="button" data-approve="' + esc(step.id) + '">'
        + label + '</button>';
    } else if (step.status === '未开放') {
      var phase = (step.module === '05' ? 'P3' : (step.module === '06' ? 'P4' : 'P2'));
      var text = (k === '04/confirm') ? '先完成步骤 1（竞对资料与草案）' : phase + ' 开放提交';
      btn = '<button class="btn btn-sm" type="button" disabled>' + text + '</button>';
    }
    return '<div class="step-card" data-step="' + esc(k) + '" data-f04-total="' + esc((d.items || []).length) + '">'
      + '<div class="step-head">'
      + (meta.seq ? '<span class="step-seq">步骤 ' + meta.seq + '</span>' : '')
      + '<span class="step-name">' + esc(meta.name) + '</span>' + tag(step.status) + '</div>'
      + '<div class="step-meta est">' + estimateText(step.estimate) + '</div>'
      + quotaBox(step) + actualText(step.actual) + body
      + '<div class="btn-row">' + btn + '</div></div>';
  }

  function render(rows) {
    var groups = { '01': [], '02': [], '03': [], '04': [], '05': [], '06': [] };
    rows.forEach(function (s) { if (groups[s.module]) groups[s.module].push(s); });
    var names = { '01': '关键词作战总表', '02': '自然位标杆', '03': '否定词清单',
      '04': '竞对对比', '05': '图片与卖点诊断', '06': '广告诊断与优化' };
    var subs = {
      '01': '上传后自动生成，无需确认',
      '02': '上传后自动生成，无需确认',
      '03': '上传后自动生成，无需确认',
      '04': '资料清洗 → 特征清单确认 → 竞对对比',
      '05': '自家图 ＋ 逐家竞对同框看图 → 图片诊断',
      '06': '规矩确认 → 动作清单 → 理由润色'
    };
    // 分组头只报汇总，不再把各步状态用「/」拼成一长串
    function summaryOf(list) {
      if (!list.length) return { prog: '', cls: 'mod-sum-off', text: '暂无步骤' };
      var st = list.map(function (s) { return s.status; });
      var active = st.filter(function (x) { return x !== '跳过'; });
      var done = st.filter(function (x) { return x === '已完成'; }).length;
      var fail = st.filter(function (x) { return x === '失败'; }).length;
      var wait = st.filter(function (x) { return x === '待确认'; }).length;
      var prog = active.length ? done + ' / ' + active.length + ' 已完成' : '本任务不适用';
      if (fail) return { prog: prog, cls: 'mod-sum-fail', text: fail + ' 项失败待处理' };
      if (wait) return { prog: prog, cls: 'mod-sum-wait', text: wait + ' 项待你确认' };
      if (active.length && done === active.length) return { prog: prog, cls: 'mod-sum-ok', text: '全部完成' };
      return { prog: prog, cls: 'mod-sum-off', text: '后续阶段开放' };
    }

    var out = '';
    Object.keys(groups).forEach(function (m) {
      var list = groups[m];
      var auto = (m === '01' || m === '02' || m === '03');
      var sum = auto ? { prog: '', cls: 'mod-sum-ok', text: '已出 · 自动' } : summaryOf(list);
      out += '<div class="mod-group' + (auto ? ' mod-group-auto' : '') + '">'
        + '<div class="mod-head">'
        + '<span class="mod-num">' + m + '</span>'
        + '<div class="mod-title-wrap"><div class="mod-title">' + esc(names[m]) + '</div>'
        + '<div class="mod-sub">' + esc(subs[m]) + '</div></div>'
        + '<div class="mod-side">'
        + (sum.prog ? '<span class="mod-progress">' + esc(sum.prog) + '</span>' : '')
        + '<span class="mod-sum ' + sum.cls + '">' + esc(sum.text) + '</span>'
        + '</div></div>';
      if (list.length) {
        out += '<div class="mod-body">';
        list.slice().sort(function (a, b) {
          return (STEP_ORDER[a.module + '/' + a.step] || 9)
            - (STEP_ORDER[b.module + '/' + b.step] || 9);
        }).forEach(function (s) { out += renderStep(s); });
        out += '</div>';
      }
      out += '</div>';
    });
    stepsBox.innerHTML = out;

    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-retry]'), function (b) {
      b.onclick = function () { submit('retry_module_step', { p_step_id: b.getAttribute('data-retry') }, b); };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-approve]'), function (b) {
      b.onclick = function () {
        var k = b.closest('.step-card').getAttribute('data-step');
        if (k === '04/confirm') approve04(b); else approve06(b);
      };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-rule-num],[data-rule-text]'), function (el) {
      el.onchange = function () { syncRules(el); markDirty(); };
    });
    Array.prototype.forEach.call(stepsBox.querySelectorAll('[data-role="rules-json"]'), function (el) {
      el.onfocus = function () { markDirty(); };
      el.oninput = function () { markDirty(); };
    });
    // 04 逐条确认：初始化计数、改动后暂停自动刷新（防 30 秒轮询把未提交的选择冲掉）
    Array.prototype.forEach.call(stepsBox.querySelectorAll('.step-card[data-step="04/confirm"]'), function (card) {
      f04Count(card);
      Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
        s.onchange = function () { f04Count(card); markDirty(); };
      });
      var reset = card.querySelector('[data-role="f04-reset"]');
      if (reset) reset.onclick = function () {
        Array.prototype.forEach.call(card.querySelectorAll('[data-f04-verdict]'), function (s) {
          s.value = s.getAttribute('data-f04-draft') || s.value;
        });
        f04Count(card);
        markDirty();
      };
    });
  }

  // 表单一旦被改过就暂停自动刷新，直到提交成功或点「手动刷新」恢复。
  function markDirty() {
    editing = true;
    document.getElementById('last-refresh').textContent = '已修改，自动刷新暂停（提交或点手动刷新恢复）';
  }

  function currentRulesJson(card) {
    var ta = card.querySelector('[data-role="rules-json"]');
    return ta ? ta.value : '';
  }
  function syncRules(el) {
    var card = el.closest('.step-card');
    var ta = card.querySelector('[data-role="rules-json"]');
    if (!ta) return;
    var r;
    try { r = JSON.parse(ta.value); } catch (e) { window.showMsg('msg', '规矩 JSON 暂时解析不了，先修好完整 JSON 再改快捷字段', 'err'); return; }
    var key = el.getAttribute('data-rule-num') || el.getAttribute('data-rule-text');
    if (el.getAttribute('data-rule-num')) r.thresholds[key] = Number(el.value);
    else if (key === 'trendMode') r.trendPolicy.mode = el.value;
    else r.answers[key] = el.value;
    ta.value = JSON.stringify(r, null, 2);
  }

  // 04 阶段二：把逐条选择汇总成 keep/drop/gap 三个名字数组，判定仍由后台按阶段一清单复核。
  function approve04(btn) {
    var card = btn.closest('.step-card');
    var sels = card.querySelectorAll('[data-f04-verdict]');
    var buckets = { keep: [], drop: [], gap: [] };
    var map = { '保留': 'keep', '剔除': 'drop', '缺口': 'gap' };
    Array.prototype.forEach.call(sels, function (s) {
      var b = map[s.value];
      if (b) buckets[b].push(s.getAttribute('data-f04-name'));
    });
    var total = buckets.keep.length + buckets.drop.length + buckets.gap.length;
    var expected = Number(card.getAttribute('data-f04-total') || 0);
    if (!total || (expected && total !== expected)) {
      window.showMsg('msg', '判定条数不对（应为 ' + expected + ' 条），请刷新页面后重新确认', 'err'); return;
    }
    submit('approve_module_step', {
      p_step_id: btn.getAttribute('data-approve'),
      p_decision: {
        keep: buckets.keep, drop: buckets.drop, gap: buckets.gap,
        confirmedFrom: '网页', confirmedAt: new Date().toISOString()
      }
    }, btn);
  }

  function approve06(btn) {
    var card = btn.closest('.step-card');
    var raw = currentRulesJson(card);
    var rules;
    try { rules = JSON.parse(raw); } catch (e) { window.showMsg('msg', '规矩 JSON 格式不对：' + e.message, 'err'); return; }
    if (!rules || !rules.rules || !rules.thresholds) {
      window.showMsg('msg', '规矩缺 rules / thresholds，不能提交', 'err'); return;
    }
    submit('approve_module_step', {
      p_step_id: btn.getAttribute('data-approve'),
      p_decision: { rules: rules, confirmedFrom: '网页', confirmedAt: new Date().toISOString() }
    }, btn);
  }

  async function submit(fn, args, btn) {
    if (btn) btn.disabled = true;
    window.showMsg('msg', '正在提交…', 'info');
    try {
      var r = await window.sb.rpc(fn, args);
      if (r.error) throw r.error;
      var okMsg = fn === 'retry_module_step'
        ? '已登记单项重试，工人会在 30 秒内领取（额度不足会再次提示）'
        : (args.p_decision && args.p_decision.keep
          ? '确认已提交：工人会按你逐条确认的判定跑 04（DeepSeek 1 次），完成后报告自动点亮 04'
          : '确认已提交，工人会在 30 秒内执行');
      window.showMsg('msg', okMsg, 'ok');
      editing = false;
      await load();
    } catch (ex) {
      window.showMsg('msg', '提交失败：' + window.humanError(ex), 'err');
      if (btn) btn.disabled = false;
    }
  }

  async function load() {
    if (!taskId) { window.showMsg('msg', '网址里没有任务号，从工具页点「模块进度」进来', 'err'); return; }
    if (editing) return;   // 正在编辑规矩时不被自动刷新打断
    var t = await window.sb.from(C.TASK_TABLE).select('*').eq('id', taskId).maybeSingle();
    if (t.error) { window.showMsg('msg', '读取任务失败：' + window.humanError(t.error), 'err'); return; }
    if (!t.data) { window.showMsg('msg', '没找到这个任务', 'err'); return; }
    var task = t.data;
    document.getElementById('meta').textContent = 'ASIN ' + task.asin + ' · 提交于 '
      + window.fmtTime(task.created_at) + ' · 状态：' + task.status + ' · 报告版本：' + (task.report_revision || 0);
    document.getElementById('report-link').innerHTML = task.report_url
      ? '<a class="btn btn-sm" href="' + window.APP_BASE + 'report/?task=' + encodeURIComponent(task.id) + '">查看报告（点亮后自动刷新）</a>'
      : '<span class="muted">报告还在生成中</span>';

    var r = await window.sb.from(C.STEP_TABLE || 'module_steps').select('*')
      .eq('task_id', taskId).order('module', { ascending: true }).order('step', { ascending: true });
    if (r.error) {
      stepsBox.innerHTML = '<div class="quota-box">读不到模块步骤：' + esc(window.humanError(r.error))
        + '。若是刚上线，请确认数据库脚本 05_模块步骤表与门禁.sql 已执行。</div>';
      return;
    }
    render(r.data || []);
    document.getElementById('last-refresh').textContent = '最后刷新 ' + new Date().toLocaleTimeString('zh-CN');
  }

  document.getElementById('btn-refresh').onclick = function () { editing = false; load(); };
  (async function () {
    session = await window.requireSession();
    if (!session) return;
    window.mountHeader('模块进度');
    await load();
    setInterval(load, C.REFRESH_MS || 30000);
  })();
})();
</script>
</body>
